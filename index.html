<style>

    --bg:#14181C;
    --surface:#1E242B;
    --surface-2:#262D35;
    --line: #333B44;
    --text:#EDEFF1;
    --text-dim:#9AA4AE;
    --accent:#C4D600;
    --accent-ink:#14181C;
    --teal:#4FA8A0;
    --ochre:#FF8A1E;
    --danger:#D65F5F;
    --radius:14px;
  }
  html[data-theme="claro"]{
    --bg:#F2F4F6;
    --surface:#FFFFFF;
    --surface-2:#E9ECEF;
    --line:#D7DCE1;
    --text:#1B2126;
    --text-dim:#63707A;
    --teal:#2F8F87;
    --ochre:#DB7300;
    --danger:#C0392B;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
  }
  header{

    background:linear-gradient(180deg, rgba(20,24,28,.95), rgba(20,24,28,.75));
    backdrop-filter: blur(6px);

  }
  header .sub{
    font-size:11.5px; color:var(--text-dim); margin-top:1px;
  }
  .sync-dot{

    box-shadow:0 0 0 3px rgba(255,255,255,.04);
  }
  .sync-dot.pend{background:var(--ochre);}
  .sync-dot.offline{background:var(--danger);}
  .sync-wrap{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--text-dim); cursor:pointer;}
  .header-actions{ display:flex; align-items:center; gap:14px; }
  .header-icon-btn{
    background:none; border:none; color:var(--text-dim); font-size:18px;
    padding:2px; line-height:1; cursor:pointer;
  }

  #map{ position:absolute; inset:0; }
  .leaflet-control-attribution{ font-size:9px; }

  .fab{
    position:fixed; right:16px; bottom:96px; z-index:1200;
    width:56px; height:56px; border-radius:50%;
    background:var(--accent); color:var(--accent-ink);
    border:none; font-size:28px; font-weight:600; line-height:1;
    box-shadow:0 6px 18px rgba(0,0,0,.4);
  }
  .fab:active{ transform: scale(.95); }

  .locate-fab{
    position:fixed; right:16px; bottom:164px; z-index:1200;
    width:44px; height:44px; border-radius:50%;
    background:var(--surface); color:var(--text);
    border:1px solid var(--line); font-size:18px;
    box-shadow:0 6px 14px rgba(0,0,0,.35);
  }
  .locate-fab.active{ background:var(--teal); color:#0E1518; border-color:var(--teal); }

  .ubi-divicon{ position:relative; }
  .ubi-punto{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:14px; height:14px; border-radius:50%;
    background:#3B82F6; border:3px solid #FFFFFF;
    box-shadow:0 0 0 2px rgba(59,130,246,.35);
  }
  .ubi-cono{
    position:absolute; left:50%; top:50%; margin-left:-9px; margin-top:-26px;
    width:0; height:0;
    border-left:9px solid transparent;
    border-right:9px solid transparent;
    border-bottom:26px solid rgba(59,130,246,.55);
    transform-origin:50% 100%;
  }
  .fit-fab{
    position:fixed; right:16px; bottom:216px; z-index:1200;
    width:44px; height:44px; border-radius:50%;
    background:var(--surface); color:var(--text);
    border:1px solid var(--line); font-size:16px;

  }
  .zone-fab{
    position:fixed; right:16px; bottom:268px; z-index:1200;

    background:var(--surface); color:var(--text);

  .route-fab{
    position:fixed; right:16px; bottom:320px; z-index:1200;
    width:44px; height:44px; border-radius:50%;
    background:var(--surface); color:var(--text);
    border:1px solid var(--line); font-size:18px;

  .route-fab.active{ background:var(--teal); color:#0E1518; border-color:var(--teal); }

  .route-banner{
    position:fixed; top:0; left:0; right:0; z-index:1400;
    background:var(--teal); color:#0E1518;

</style>

<script>
/* ---------- Tema: claro / oscuro / sistema ---------- */
const TEMA_KEY = 'gc_tema_v1';
function obtenerTemaGuardado(){
  return localStorage.getItem(TEMA_KEY) || 'sistema';
}
function guardarTemaPreferido(pref){
  localStorage.setItem(TEMA_KEY, pref);
}
function resolverTemaEfectivo(pref){
  if(pref === 'claro' || pref === 'oscuro') return pref;
  const prefiereClaro = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  return prefiereClaro ? 'claro' : 'oscuro';
}
function aplicarTema(pref){
  const efectivo = resolverTemaEfectivo(pref);
  document.documentElement.setAttribute('data-theme', efectivo);
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', efectivo === 'claro' ? '#F2F4F6' : '#14181C');
}
let temaPref = obtenerTemaGuardado();
aplicarTema(temaPref);
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
    if(temaPref === 'sistema') aplicarTema(temaPref);
  });
}

/* ---------- Estado y almacenamiento local ---------- */
const STORAGE_KEY = 'gc_prospectos_v1';
const ELIMINAR_KEY = 'gc_pendientes_eliminar_v1';
// Lista aparte y PERMANENTE (nunca se vacía) de ids del catálogo DENUE que se
// eliminaron a propósito: sin esto, cargarDenueCompartido() los vuelve a
// meter cada vez que descarga denue-import.json, porque ese archivo no sabe
// que ya los borraste en este dispositivo.
const DENUE_EXCLUIDOS_KEY = 'gc_denue_excluidos_v1';
// Pega aquí la URL del Web App de Apps Script una vez publicada (termina en
// /exec). Mientras esté vacía, todo sigue viviendo solo local como antes.
const SHEET_ENDPOINT = 'https://script.google.com/macros/s/AKfycby28N3lAhtsj9UeI7SvzUPE6KkDrMGq_2oc4K6EQE3eI6tPuFub3UQH6KwzNUNnx0xudg/exec';

function cargarProspectos(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch(e){ return []; }
}
function guardarProspectos(lista){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(lista));
}
let prospectos = cargarProspectos();

function cargarPendientesEliminar(){
  try{ return JSON.parse(localStorage.getItem(ELIMINAR_KEY)) || []; }
  catch(e){ return []; }
}
function guardarPendientesEliminar(lista){
  localStorage.setItem(ELIMINAR_KEY, JSON.stringify(lista));
}

function cargarDenueExcluidos(){
  try{ return JSON.parse(localStorage.getItem(DENUE_EXCLUIDOS_KEY)) || []; }
  catch(e){ return []; }
}
function agregarDenueExcluido(id){
  const lista = cargarDenueExcluidos();
  if(!lista.includes(id)){
    lista.push(id);
    localStorage.setItem(DENUE_EXCLUIDOS_KEY, JSON.stringify(lista));
  }
}

// Empuja lo que cambió en este dispositivo (altas, ediciones, bajas) al
// Sheet compartido, y luego trae lo más reciente de los demás dispositivos.
// "Última edición gana" usando actualizadoEn; lo que sigue pendiente de subir
// (pendienteSync) nunca se pisa con lo que venga del servidor todavía.
let sincronizando = false;
async function syncPendientes(){
  if(!SHEET_ENDPOINT || !navigator.onLine || sincronizando) return;
  sincronizando = true;
  actualizarHeader();
  try{
    const pendientes = prospectos.filter(p => p.pendienteSync);
    const eliminados = cargarPendientesEliminar();

    if(pendientes.length > 0 || eliminados.length > 0){
      // Sin headers personalizados a propósito: evita el preflight CORS que
      // Apps Script no maneja bien. El body sigue siendo JSON válido.
      await fetch(SHEET_ENDPOINT, {
        method: 'POST',
        body: JSON.stringify({ upserts: pendientes, deletes: eliminados })
      });
    }

    const resp = await fetch(SHEET_ENDPOINT);
    const remotos = await resp.json();

    remotos.forEach(r => {
      const i = prospectos.findIndex(p => p.id === r.id);
      if(i === -1){
        prospectos.push(r);
      } else if(!prospectos[i].pendienteSync && (r.actualizadoEn || 0) >= (prospectos[i].actualizadoEn || 0)){
        prospectos[i] = { ...prospectos[i], ...r, pendienteSync: false };
      }
    });

    prospectos.forEach(p => {
      if(pendientes.some(x => x.id === p.id)) p.pendienteSync = false;
    });

    guardarPendientesEliminar([]);
    guardarProspectos(prospectos);
    renderMarcadores();
    if(currentTab === 'lista') renderLista();
  } catch(err){
    // Sin señal real o el Web App no respondió: se reintenta solo en el
    // próximo evento "online" o el siguiente intervalo.
  } finally {
    sincronizando = false;
    actualizarHeader();
  }
}

const ESTATUS = ['Prospecto','Visitado','Cliente','Competencia','Descartado'];
const FRECUENCIA = ['Semanal','Quincenal','Mensual','Ocasional'];
const COLOR_ESTATUS = {
  'Prospecto': '#FF8A1E',
  'Visitado':  '#2FA89D',
  'Cliente':   '#C4D600',
  'Competencia': '#9B5DE5',
  'Descartado':'#8A94A0'
};
const ESTADOS = ['Yucatán','Quintana Roo'];

/* ---------- Mapa ---------- */
const map = L.map('map', { zoomControl:false, attributionControl:true })
  .setView([20.70, -89.10], 9); // centrado aprox. en Yucatán

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

L.control.zoom({ position:'bottomleft' }).addTo(map);

function crearIconoCluster(cluster){
  const hijos = cluster.getAllChildMarkers();
  const n = hijos.length;
  const size = n < 10 ? 34 : (n < 50 ? 42 : 50);

  let cliente = 0, visitado = 0, prospecto = 0;
  hijos.forEach(m => {
    if(m.prospectoEstatus === 'Cliente') cliente++;
    else if(m.prospectoEstatus === 'Visitado') visitado++;
    else if(m.prospectoEstatus === 'Prospecto') prospecto++;
  });

  let color = COLOR_ESTATUS['Prospecto'];
  if(cliente > 0) color = COLOR_ESTATUS['Cliente'];
  else if(visitado > prospecto) color = COLOR_ESTATUS['Visitado'];

  return L.divIcon({
    html: `<div class="cluster-burbuja" style="width:${size}px;height:${size}px;background:${color};font-size:${n<50?13:14}px;">${n}</div>`,
    className: '',
    iconSize: [size, size]
  });
}

const MODO_MAPA_KEY = 'gc_modo_mapa_v1';
function obtenerModoMapaGuardado(){
  return localStorage.getItem(MODO_MAPA_KEY) || 'agrupado';
}
function guardarModoMapaPreferido(valor){
  localStorage.setItem(MODO_MAPA_KEY, valor);
}
let modoMapa = obtenerModoMapaGuardado();

// Clustering: agrupa en una burbuja los prospectos muy juntos o exactamente
// sobrepuestos (imposibles de separar solo haciendo zoom) y reduce a la vez
// cuántos pines reales hay que dibujar en pantalla con miles de registros —
// esto se queda activo SIEMPRE, incluso planeando ruta, porque es lo que
// hace que abrir el modo de selección sea instantáneo. Por debajo de zoom 16
// (calle/manzana) se desagrupa todo para tocar cada negocio con precisión.
// En "Individual" (Ajustes) se apaga por completo: útil para revisar todo
// sin agrupar, a costa de ir más lento con muchos registros a la vez.
const markersLayer = L.markerClusterGroup({
  iconCreateFunction: crearIconoCluster,
  showCoverageOnHover: false,
  spiderfyOnMaxZoom: true,
  disableClusteringAtZoom: modoMapa === 'individual' ? 1 : 16,
  chunkedLoading: true,
  maxClusterRadius: 50
}).addTo(map);
let userMarker = null;

function aplicarModoMapa(valor){
  modoMapa = valor;
  guardarModoMapaPreferido(valor);
  markersLayer.options.disableClusteringAtZoom = valor === 'individual' ? 1 : 16;
  renderMarcadores();
}

// Id de prospecto -> su marcador real en el mapa. Sirve para actualizar SOLO
// el pin que cambió (por ejemplo al seleccionarlo para una ruta) en vez de
// reconstruir los cientos de pines visibles cada vez — eso es lo que hacía
// que seleccionar/deseleccionar se sintiera lento.
const marcadoresPorId = new Map();

function pasaFiltro(p){
  const okEstatus = estadoFiltro.estatus === 'Todos' || p.estatus === estadoFiltro.estatus;
  const okEstado = estadoFiltro.estado === 'Todos' || !p.estado || p.estado === estadoFiltro.estado;
  const okLocalidad = estadoFiltro.localidad === 'Todas' || p.localidad === estadoFiltro.localidad;
  const okFrecuencia = estadoFiltro.frecuencia === 'Todas' || p.frecuencia === estadoFiltro.frecuencia;
  const okPrioridad = !estadoFiltro.soloPrioridad || !!p.prioridad;
  const okBusqueda = !textoBusqueda || (
    (p.nombre || '').toLowerCase().includes(textoBusqueda.toLowerCase()) ||
    (p.notas || '').toLowerCase().includes(textoBusqueda.toLowerCase())
  );
  return okEstatus && okEstado && okLocalidad && okFrecuencia && okPrioridad && okBusqueda;
}

function localidadesDisponibles(){
  const set = new Set(prospectos.filter(p => p.localidad).map(p => p.localidad));
  return [...set].sort((a, b) => a.localeCompare(b, 'es', { sensitivity: 'base' }));
}

function crearIconoPinTemp(){
  const size = 30;
  const html = `
    <div class="map-pin-wrap" style="width:${size}px; height:${size}px;">
      <div class="map-pin-shape" style="background:#C4D600"></div>
      <div class="map-pin-icon" style="font-size:13px; color:#0E1518;"><span>＋</span></div>
    </div>`;
  return L.divIcon({
    className: '',
    html,
    iconSize: [size, size],
    iconAnchor: [size / 2, size],
    popupAnchor: [0, -size]
  });
}

function crearIconoPin(p, opciones){
  const { esDenue, enRuta, idxRuta, seleccionado, esPrioridad, numeroSeleccion } = opciones;
  const size = esDenue ? 22 : 28;
  const claseForma = ['map-pin-shape'];
  if(seleccionado) claseForma.push('seleccionado');
  else if(esPrioridad) claseForma.push('prioridad');

  let icono = '<span class="punto"></span>';
  if(enRuta) icono = `<span>${idxRuta + 1}</span>`;
  else if(numeroSeleccion) icono = `<span>${numeroSeleccion}</span>`;
  else if(esPrioridad) icono = '<span>!</span>';

  const html = `
    <div class="map-pin-wrap" style="width:${size}px; height:${size}px;">
      <div class="${claseForma.join(' ')}" style="background:${COLOR_ESTATUS[p.estatus] || '#9AA4AE'}"></div>
      <div class="map-pin-icon" style="font-size:${esDenue ? 10 : 11}px;">${icono}</div>
    </div>`;

  return L.divIcon({
    className: '',
    html,
    iconSize: [size, size],
    iconAnchor: [size / 2, size],
    popupAnchor: [0, -size]
  });
}

// Posición (1, 2, 3…) en la que se seleccionó este id para la ruta, en el
// orden real en que se fue tocando — no el orden ya optimizado.
function numeroDeSeleccion(id){
  if(!seleccionRuta.has(id)) return null;
  return [...seleccionRuta].indexOf(id) + 1;
}

function renderMarcadores(){
  markersLayer.clearLayers();
  marcadoresPorId.clear();
  const nuevosMarcadores = [];
  prospectos
    .filter(pasaFiltro)
    .forEach(p => {
      const esDenue = p.origen === 'DENUE';
      const idxRuta = rutaCalculada ? rutaCalculada.paradas.findIndex(x => x.id === p.id) : -1;
      const enRuta = idxRuta !== -1;
      const numeroSeleccion = (modoRuta && !enRuta) ? numeroDeSeleccion(p.id) : null;
      const seleccionado = (modoRuta && seleccionRuta.has(p.id)) || enRuta;
      const esPrioridad = !!p.prioridad;
      const opciones = { esDenue, enRuta, idxRuta, seleccionado, esPrioridad, numeroSeleccion };
      const m = L.marker([p.lat, p.lng], { icon: crearIconoPin(p, opciones) })
        .bindPopup(`<b>${escapeHtml(p.nombre)}</b>${esPrioridad ? ' ⚠️' : ''}<br>${p.estatus} · ${p.frecuencia}<br><span style="color:#9AA4AE">${p.origen}${p.municipio ? ' · ' + escapeHtml(p.municipio) : ''}</span>`);
      m.prospectoEstatus = p.estatus;

      // Mantener presionado ~3s muestra la etiqueta (popup) sin entrar a
      // editar; si se disparó, el "click" al soltar el dedo se ignora una
      // sola vez para no saltar de inmediato a la ficha de edición.
      let temporizadorPress = null;
      let etiquetaMostrada = false;
      m.on('add', () => {
        const el = m.getElement();
        if(!el) return;
        const iniciarPress = () => {
          etiquetaMostrada = false;
          temporizadorPress = setTimeout(() => { etiquetaMostrada = true; m.openPopup(); }, 3000);
        };
        const cancelarPress = () => { if(temporizadorPress){ clearTimeout(temporizadorPress); temporizadorPress = null; } };
        el.addEventListener('touchstart', iniciarPress, { passive: true });
        el.addEventListener('touchend', cancelarPress);
        el.addEventListener('touchmove', cancelarPress);
        el.addEventListener('touchcancel', cancelarPress);
        el.addEventListener('mousedown', iniciarPress);
        el.addEventListener('mouseup', cancelarPress);
        el.addEventListener('mouseleave', cancelarPress);
      });

      m.on('click', () => {
        if(etiquetaMostrada){ etiquetaMostrada = false; return; }
        if(modoRuta){ toggleSeleccionRuta(p.id); return; }
        if(enRuta){ quitarParadaDeRuta(p.id); return; }
        abrirDetalle(p.id);
      });
      marcadoresPorId.set(p.id, m);
      nuevosMarcadores.push(m);
    });
  if(typeof markersLayer.addLayers === 'function'){
    markersLayer.addLayers(nuevosMarcadores);
  } else {
    nuevosMarcadores.forEach(m => markersLayer.addLayer(m));
  }
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

// Recalcula y aplica solo el ícono de UN pin (sin tocar los demás). Esto es
// lo que hace que seleccionar/deseleccionar en modo ruta se sienta al
// instante, en vez de reconstruir todos los pines visibles en cada toque.
function actualizarIconoIndividual(id){
  const m = marcadoresPorId.get(id);
  const p = prospectos.find(x => x.id === id);
  if(!m || !p) return;
  const esDenue = p.origen === 'DENUE';
  const idxRuta = rutaCalculada ? rutaCalculada.paradas.findIndex(x => x.id === id) : -1;
  const enRuta = idxRuta !== -1;
  const numeroSeleccion = (modoRuta && !enRuta) ? numeroDeSeleccion(id) : null;
  const seleccionado = (modoRuta && seleccionRuta.has(id)) || enRuta;
  const esPrioridad = !!p.prioridad;
  m.setIcon(crearIconoPin(p, { esDenue, enRuta, idxRuta, seleccionado, esPrioridad, numeroSeleccion }));
  if(typeof markersLayer.refreshClusters === 'function') markersLayer.refreshClusters(m);
}

/* ---------- Selección de ubicación (GPS o toque en mapa) ---------- */
let pickingLocation = false;
let tempCoord = null;
let tempLugar = null; // { municipio, localidad } detectado solo automáticamente
let tempMarker = null;

/* ---------- Ubicación en el mapa: un toque centra, otro sigue con rumbo ----------
   Imita el botón de "mi ubicación" de Google Maps: 1er toque = centra y
   muestra un punto; 2do toque = modo "siguiendo", el punto se convierte en
   un cono que gira según hacia dónde apunta el teléfono, y el mapa se
   recentra solo con cada actualización de GPS. Si el usuario mueve el mapa
   con el dedo, se sale del seguimiento (para no pelear con su gesto). */
let modoUbicacion = 'apagado'; // 'apagado' | 'centrado' | 'siguiendo'
let watchIdUbicacion = null;
let listenerRumbo = null;
let ultimoRumbo = 0;

function iconoUbicacion(conRumbo){
  const cono = conRumbo ? `<div class="ubi-cono" style="transform:rotate(${ultimoRumbo}deg)"></div>` : '';
  return L.divIcon({
    className: 'ubi-divicon',
    html: `${cono}<div class="ubi-punto"></div>`,
    iconSize: [1, 1],
    iconAnchor: [0, 0]
  });
}

function colocarMarcadorUbicacion(lat, lng, conRumbo){
  const icon = iconoUbicacion(conRumbo);
  if(userMarker){
    userMarker.setLatLng([lat, lng]);
    userMarker.setIcon(icon);
  } else {
    userMarker = L.marker([lat, lng], { icon, zIndexOffset: 1000, interactive: false }).addTo(map);
  }
}

function detenerSeguimientoUbicacion(){
  if(watchIdUbicacion !== null){ navigator.geolocation.clearWatch(watchIdUbicacion); watchIdUbicacion = null; }
  if(listenerRumbo){
    window.removeEventListener('deviceorientationabsolute', listenerRumbo);
    window.removeEventListener('deviceorientation', listenerRumbo);
    listenerRumbo = null;
  }
}

// Evita que la pantalla se apague sola mientras se está siguiendo la
// ubicación en movimiento (como hacen las apps de navegación).
let wakeLock = null;
async function solicitarWakeLock(){
  if(!('wakeLock' in navigator)) return;
  try{
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch(e){ wakeLock = null; }
}
function liberarWakeLock(){
  if(wakeLock){ wakeLock.release().catch(() => {}); wakeLock = null; }
}

function salirModoUbicacion(){
  detenerSeguimientoUbicacion();
  liberarWakeLock();
  modoUbicacion = 'apagado';
  document.getElementById('btnLocate').classList.remove('active');
  if(userMarker) userMarker.setIcon(iconoUbicacion(false));
}

// Desplaza un punto una distancia (en metros) en dirección "rumbo" — se usa
// para centrar el mapa un poco ADELANTE de ti en vez de justo encima tuyo,
// así se ve más camino por recorrer y menos de lo que ya dejaste atrás.
function puntoDesplazadoPorRumbo(lat, lng, rumboDeg, distanciaMetros){
  const R = 6371000;
  const rumboRad = rumboDeg * Math.PI / 180;
  const latRad = lat * Math.PI / 180;
  const nuevaLatRad = Math.asin(
    Math.sin(latRad) * Math.cos(distanciaMetros / R) +
    Math.cos(latRad) * Math.sin(distanciaMetros / R) * Math.cos(rumboRad)
  );
  const nuevaLngRad = (lng * Math.PI / 180) + Math.atan2(
    Math.sin(rumboRad) * Math.sin(distanciaMetros / R) * Math.cos(latRad),
    Math.cos(distanciaMetros / R) - Math.sin(latRad) * Math.sin(nuevaLatRad)
  );
  return { lat: nuevaLatRad * 180 / Math.PI, lng: nuevaLngRad * 180 / Math.PI };
}

function activarSeguimientoConRumbo(){
  modoUbicacion = 'siguiendo';
  document.getElementById('btnLocate').classList.add('active');
  mostrarToast('Siguiendo tu ubicación y hacia dónde apunta el teléfono');
  solicitarWakeLock();

  watchIdUbicacion = navigator.geolocation.watchPosition(pos => {
    const { latitude, longitude } = pos.coords;
    const centro = puntoDesplazadoPorRumbo(latitude, longitude, ultimoRumbo, 120);
    map.panTo([centro.lat, centro.lng], { animate: true });
    colocarMarcadorUbicacion(latitude, longitude, true);
  }, () => {}, { enableHighAccuracy: true });

  listenerRumbo = (e) => {
    let rumbo = null;
    if(typeof e.webkitCompassHeading === 'number') rumbo = e.webkitCompassHeading; // Safari/iOS
    else if(e.alpha != null) rumbo = 360 - e.alpha;
    if(rumbo == null) return;
    ultimoRumbo = rumbo;
    if(userMarker) userMarker.setIcon(iconoUbicacion(true));
  };

  // iOS exige pedir permiso explícito para el sensor de orientación,
  // y solo lo concede si se pide justo dentro de un toque del usuario.
  if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
    DeviceOrientationEvent.requestPermission()
      .then(resp => { if(resp === 'granted') window.addEventListener('deviceorientation', listenerRumbo); })
      .catch(() => {});
  } else {
    window.addEventListener('deviceorientationabsolute', listenerRumbo);
    window.addEventListener('deviceorientation', listenerRumbo);
  }
}

document.getElementById('btnLocate').addEventListener('click', () => {
  if(!navigator.geolocation){ mostrarToast('Este dispositivo no soporta GPS'); return; }

  if(modoUbicacion === 'apagado'){
    mostrarToast('Buscando tu ubicación…');
    navigator.geolocation.getCurrentPosition(pos => {
      const { latitude, longitude } = pos.coords;
      map.setView([latitude, longitude], Math.max(map.getZoom(), 15));
      colocarMarcadorUbicacion(latitude, longitude, false);
      modoUbicacion = 'centrado';
      document.getElementById('btnLocate').classList.add('active');
    }, () => mostrarToast('No se pudo obtener tu ubicación'), { enableHighAccuracy: true, timeout: 8000 });
  } else if(modoUbicacion === 'centrado'){
    activarSeguimientoConRumbo();
  } else {
    salirModoUbicacion();
  }
});

// Manipular el mapa con el dedo (arrastrarlo) es la señal natural de que ya
// no se quiere seguir centrado automáticamente en la ubicación.
map.on('dragstart', () => {
  if(modoUbicacion !== 'apagado') salirModoUbicacion();
});

// Ahorra batería: si la app queda en segundo plano, se detiene el GPS/brújula.
document.addEventListener('visibilitychange', () => {
  if(document.hidden && modoUbicacion !== 'apagado') salirModoUbicacion();
});

document.getElementById('btnFit').addEventListener('click', () => {
  ajustarVistaATodos();
});

document.getElementById('btnZonaOffline').addEventListener('click', () => {
  abrirSheet();
  cambiarTab('zonas');
});

/* ---------- Selección de ruta directamente en el mapa ----------
   En vez de escoger de una lista larga y dispersa, el modo ruta resalta un
   anillo verde en cada prospecto que se va tocando en el propio mapa. */
function activarModoRutaEnMapa(){

}

function actualizarRouteBanner(){
  const el = document.getElementById('routeBannerTxt');
  if(el) el.textContent = `Toca los prospectos en el mapa para sumarlos a la ruta (${seleccionRuta.size})`;
}

function toggleSeleccionRuta(id){
  if(seleccionRuta.has(id)){
    seleccionRuta.delete(id);
    actualizarRouteBanner();
    actualizarIconoIndividual(id); // le quita el número
    seleccionRuta.forEach(otroId => actualizarIconoIndividual(otroId)); // renumera lo que queda
  } else {
    seleccionRuta.add(id);
    actualizarRouteBanner();
    actualizarIconoIndividual(id); // le pone su número (el último)
  }
  if(currentTab === 'lista') renderLista();
}

document.getElementById('btnPlanRuta').addEventListener('click', () => {

    seleccionRuta.clear();

});
document.getElementById('btnRutaListo').addEventListener('click', () => {
  if(seleccionRuta.size === 0){ mostrarToast('Toca al menos un prospecto en el mapa'); return; }
  calcularYMostrarRuta();
});

/* ---------- Guardar tiles del mapa para trabajar sin señal ----------
   En carretera/poblados sin cobertura, Leaflet no puede pedir tiles nuevos.
   Esto descarga por adelantado (mientras haya señal) los recuadros del mapa
   de un área — la vista actual o un área más grande dibujada a mano para
   tramos largos de carretera — y los deja en la misma caché que usa el
   service worker (rutas-gc-tiles-v1) para que se sirvan solos sin conexión.
   Cada descarga queda registrada (fecha, área, cuántos recuadros) para poder
   verla y eliminarla después si ya no se necesita. */
const TILES_CACHE_NAME = 'rutas-gc-tiles-v1'; // debe coincidir con CACHE_TILES en sw.js
const ZONAS_KEY = 'gc_zonas_descargadas_v1';
const LIMITE_TILES_RECOMENDADO = 3000; // tope para que un área grande no tarde una eternidad

function latLngATile(lat, lng, zoom){
  const n = Math.pow(2, zoom);
  const x = Math.floor((lng + 180) / 360 * n);
  const latRad = lat * Math.PI / 180;
  const y = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n);
  return { x: Math.max(0, Math.min(n - 1, x)), y: Math.max(0, Math.min(n - 1, y)) };
}

function contarTiles(bounds, zooms){
  let total = 0;
  zooms.forEach(z => {
    const nw = latLngATile(bounds.getNorth(), bounds.getWest(), z);
    const se = latLngATile(bounds.getSouth(), bounds.getEast(), z);
    total += (se.x - nw.x + 1) * (se.y - nw.y + 1);
  });
  return total;
}

// Entre más grande el área (un tramo largo de carretera), menos niveles de
// zoom conviene guardar — si no, un área grande podría pedir decenas de
// miles de recuadros. Se van quitando los zooms más pesados (los más
// cercanos) hasta quedar dentro de un tope razonable.
function elegirZoomsParaArea(bounds){
  const zoomBase = map.getZoom();
  let candidatos = [...new Set([
    Math.max(zoomBase - 1, 10), zoomBase, Math.min(zoomBase + 1, 17), Math.min(zoomBase + 2, 17)
  ])].sort((a, b) => a - b);

  while(candidatos.length > 1 && contarTiles(bounds, candidatos) > LIMITE_TILES_RECOMENDADO){
    candidatos.pop();
  }
  return candidatos;
}

async function descargarTilesDeArea(bounds, zooms){
  const subdominios = ['a', 'b', 'c'];
  const cache = await caches.open(TILES_CACHE_NAME);
  let total = 0, ok = 0;
  const tareas = [];

  zooms.forEach(z => {
    const nw = latLngATile(bounds.getNorth(), bounds.getWest(), z);
    const se = latLngATile(bounds.getSouth(), bounds.getEast(), z);
    for(let x = nw.x; x <= se.x; x++){
      for(let y = nw.y; y <= se.y; y++){
        const s = subdominios[(x + y) % subdominios.length];
        const url = `https://${s}.tile.openstreetmap.org/${z}/${x}/${y}.png`;
        total++;
        tareas.push(fetch(url, { mode: 'no-cors' }).then(r => { cache.put(url, r); ok++; }).catch(() => {}));
      }
    }
  });

  mostrarToast('Descargando mapa de la zona… puede tardar según el tamaño del área');
  await Promise.all(tareas);
  return { total, ok };
}

function mostrarResultadoDescarga({ total, ok }){
  if(ok === 0){
    mostrarToast('No se pudo descargar el mapa: revisa tu señal e inténtalo de nuevo');
  } else {
    const pesoAprox = ((ok * 15) / 1024).toFixed(1); // ~15 KB por recuadro, estimado
    mostrarToast(`Zona guardada: ${ok} de ${total} recuadros (~${pesoAprox} MB) listos para sin señal`);
  }
}

function cargarZonasDescargadas(){
  try{ return JSON.parse(localStorage.getItem(ZONAS_KEY)) || []; }
  catch(e){ return []; }
}
function guardarZonasDescargadas(lista){
  localStorage.setItem(ZONAS_KEY, JSON.stringify(lista));
}
function registrarZonaDescargada(bounds, zooms, totalTiles){
  const zonas = cargarZonasDescargadas();
  zonas.push({
    id: 'z_' + Date.now(),
    fecha: new Date().toISOString(),
    bounds: { n: bounds.getNorth(), s: bounds.getSouth(), e: bounds.getEast(), o: bounds.getWest() },
    zooms,
    totalTiles
  });
  guardarZonasDescargadas(zonas);
}

async function procesarDescargaDeArea(bounds){
  if(!('caches' in window)){ mostrarToast('Este navegador no permite guardar mapas sin conexión'); return; }
  if(!navigator.onLine){ mostrarToast('Necesitas señal ahora para guardar el mapa de esta zona'); return; }

  const zooms = elegirZoomsParaArea(bounds);
  const totalEstimado = contarTiles(bounds, zooms);
  const pesoAprox = ((totalEstimado * 15) / 1024).toFixed(1);
  let mensaje = `Se descargarán ${totalEstimado} recuadros de mapa (~${pesoAprox} MB) en ${zooms.length} nivel(es) de zoom.\n\n` +
    'Esto guarda solo las calles del mapa (los prospectos y sus datos ya funcionan sin señal siempre).';
  if(totalEstimado > LIMITE_TILES_RECOMENDADO){
    mensaje += '\n\nEs un área grande: puede tardar varios minutos y ocupar más espacio.';
  }
  mensaje += '\n\n¿Continuar?';
  if(!confirm(mensaje)) return;

  const resultado = await descargarTilesDeArea(bounds, zooms);
  if(resultado.ok > 0) registrarZonaDescargada(bounds, zooms, resultado.ok);
  mostrarResultadoDescarga(resultado);
  if(currentTab === 'zonas') renderZonas();
}

function descargarZonaActual(){
  return procesarDescargaDeArea(map.getBounds());
}

async function eliminarZonaDescargada(id){
  const zonas = cargarZonasDescargadas();
  const zona = zonas.find(z => z.id === id);
  if(!zona) return;
  if(!confirm('¿Eliminar este mapa guardado? Dejarás de ver esa zona sin señal (si otra zona guardada se traslapa con esta, esa parte seguirá disponible).')) return;

  const cache = await caches.open(TILES_CACHE_NAME);
  const bounds = L.latLngBounds([zona.bounds.s, zona.bounds.o], [zona.bounds.n, zona.bounds.e]);
  const subdominios = ['a', 'b', 'c'];
  const borrados = [];

  zona.zooms.forEach(z => {
    const nw = latLngATile(bounds.getNorth(), bounds.getWest(), z);
    const se = latLngATile(bounds.getSouth(), bounds.getEast(), z);
    for(let x = nw.x; x <= se.x; x++){
      for(let y = nw.y; y <= se.y; y++){
        const s = subdominios[(x + y) % subdominios.length];
        borrados.push(cache.delete(`https://${s}.tile.openstreetmap.org/${z}/${x}/${y}.png`));
      }
    }
  });

  await Promise.all(borrados);
  guardarZonasDescargadas(zonas.filter(z => z.id !== id));
  mostrarToast('Zona eliminada');
  renderZonas();
}

let modoDibujoZona = false;
let dibujoInicio = null;
let rectanguloDibujo = null;

function activarDibujoZona(){
  modoDibujoZona = true;
  map.dragging.disable();
  document.getElementById('zoneDrawBanner').style.display = 'flex';

function salirDibujoZona(){
  modoDibujoZona = false;
  map.dragging.enable();
  document.getElementById('zoneDrawBanner').style.display = 'none';
  if(rectanguloDibujo){ map.removeLayer(rectanguloDibujo); rectanguloDibujo = null; }
  dibujoInicio = null;
}

function obtenerLatLngDeEvento(e){
  const punto = e.touches && e.touches.length ? e.touches[0] : e;
  const rect = map.getContainer().getBoundingClientRect();
  return map.containerPointToLatLng([punto.clientX - rect.left, punto.clientY - rect.top]);
}

function onDibujoStart(e){
  if(!modoDibujoZona) return;
  dibujoInicio = obtenerLatLngDeEvento(e);
  if(rectanguloDibujo) map.removeLayer(rectanguloDibujo);
  rectanguloDibujo = L.rectangle(L.latLngBounds(dibujoInicio, dibujoInicio), {
    color: '#C4D600', weight: 2, fillOpacity: 0.12
  }).addTo(map);
}
function onDibujoMove(e){
  if(!modoDibujoZona || !dibujoInicio) return;
  rectanguloDibujo.setBounds(L.latLngBounds(dibujoInicio, obtenerLatLngDeEvento(e)));
}
function onDibujoEnd(){ dibujoInicio = null; }

const mapEl = map.getContainer();
mapEl.addEventListener('mousedown', onDibujoStart);
mapEl.addEventListener('mousemove', onDibujoMove);
mapEl.addEventListener('mouseup', onDibujoEnd);
mapEl.addEventListener('touchstart', onDibujoStart, { passive: true });
mapEl.addEventListener('touchmove', onDibujoMove, { passive: true });
mapEl.addEventListener('touchend', onDibujoEnd);

document.getElementById('btnZonaCancelar').addEventListener('click', salirDibujoZona);
document.getElementById('btnZonaDescargarArea').addEventListener('click', async () => {
  if(!rectanguloDibujo){ mostrarToast('Primero arrastra sobre el mapa para dibujar el área'); return; }
  const bounds = rectanguloDibujo.getBounds();
  if(!bounds.isValid() || bounds.getNorth() === bounds.getSouth()){
    mostrarToast('El área es muy pequeña, intenta de nuevo');
    return;
  }
  salirDibujoZona();
  await procesarDescargaDeArea(bounds);
});

function fijarCoordTemporal(lat, lng){
  tempCoord = { lat, lng };
  tempLugar = null;
  if(tempMarker) map.removeLayer(tempMarker);
  tempMarker = L.marker([lat, lng], { icon: crearIconoPinTemp() }).addTo(map);
  const pill = document.getElementById('coordPill');
  if(pill){
    pill.style.display = 'block';

  }
  detectarLugarParaTemp(lat, lng);
}

// Identifica localidad/municipio solo (sin pedirle nada al usuario) usando el
// mismo servicio del que ya vienen los tiles del mapa (OpenStreetMap /
// Nominatim). Si no hay señal o el servicio no responde, se deja en blanco
// y se puede llenar a mano — nunca bloquea el guardado.
async function detectarLugarParaTemp(lat, lng){
  if(!navigator.onLine) return;
  try{
    const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=14&addressdetails=1`);
    const datos = await resp.json();
    const dir = datos.address || {};
    const municipio = dir.city || dir.town || dir.municipality || dir.county || '';
    const localidad = dir.village || dir.suburb || dir.neighbourhood || dir.hamlet || municipio;
    if(!municipio && !localidad) return;
    // Si mientras tanto se cambió/canceló la ubicación temporal, se descarta.
    if(!tempCoord || tempCoord.lat !== lat || tempCoord.lng !== lng) return;
    tempLugar = { municipio, localidad };
    const pill = document.getElementById('coordPill');
    if(pill) pill.textContent = `Ubicación lista: ${lat.toFixed(5)}, ${lng.toFixed(5)}${localidad ? ' · ' + localidad : ''}`;
  } catch(e){ /* sin señal o el servicio no respondió: queda en blanco */ }
}

function habilitarArrastreSheet(){
  const handle = document.getElementById('sheetHandle');
  let startY = null;
  let startHeight = 0;
  // Blindaje: en los primeros instantes tras cargar la página, un toque
  // residual (por ejemplo el mismo con el que se abrió la app) puede caer
  // sobre la manija y, con un delta casi nulo, "alternar" la hoja a abierta
  // sin que el usuario lo haya pedido. Se ignoran gestos muy al inicio.
  let listo = false;
  setTimeout(() => { listo = true; }, 700);

  const onMove = (e) => {
    if(startY === null) return;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const delta = clientY - startY;
    const isOpen = sheet.classList.contains('open');
    const base = isOpen ? 0 : startHeight - 74;
    let newY = base + delta;
    newY = Math.max(0, Math.min(startHeight - 74, newY));
    sheet.style.transition = 'none';
    sheet.style.transform = `translateY(${newY}px)`;
  };

  const onEnd = (e) => {
    if(startY === null) return;
    const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
    const delta = clientY - startY;
    const isOpenBefore = sheet.classList.contains('open');
    const threshold = 55;

    sheet.style.transition = '';
    sheet.style.transform = '';

    if(listo){
      if(Math.abs(delta) < 8){
        sheet.classList.toggle('open', !isOpenBefore);
      } else if(delta < -threshold){
        sheet.classList.add('open');
      } else if(delta > threshold){
        sheet.classList.remove('open');
      } else {
        sheet.classList.toggle('open', isOpenBefore);
      }
    }

    startY = null;
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onEnd);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onEnd);
  };

  const onStart = (e) => {
    startY = e.touches ? e.touches[0].clientY : e.clientY;
    startHeight = sheet.offsetHeight;
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
    document.addEventListener('touchmove', onMove, { passive:true });
    document.addEventListener('touchend', onEnd);
  };

  handle.addEventListener('mousedown', onStart);
  handle.addEventListener('touchstart', onStart, { passive:true });
}

/* ---------- Vista: Ruta (selección de prospectos + orden sugerido) ---------- */
function distanciaKm(a, b){
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

// Heurística del vecino más cercano: no es la ruta perfecta, pero evita ir y
// venir sobre los mismos tramos, que es justo el problema a resolver aquí.
function ordenarPorVecinoMasCercano(origen, puntos){
  const restantes = [...puntos];
  const orden = [];
  let actual = origen;
  if(!actual && restantes.length){
    actual = { lat: restantes[0].lat, lng: restantes[0].lng };
    orden.push(restantes.shift());
  }
  while(restantes.length){
    let mejorIdx = 0, mejorDist = Infinity;
    restantes.forEach((p, i) => {
      const d = distanciaKm(actual, p);
      if(d < mejorDist){ mejorDist = d; mejorIdx = i; }
    });
    const siguiente = restantes.splice(mejorIdx, 1)[0];
    orden.push(siguiente);
    actual = { lat: siguiente.lat, lng: siguiente.lng };
  }
  return orden;
}

function largoDeRuta(origen, orden){
  let total = 0;
  let anterior = origen;
  orden.forEach(p => {
    if(anterior) total += distanciaKm(anterior, p);
    anterior = p;
  });
  return total;
}

// 2-opt: revisa pares de tramos y, si invertir el segmento entre ellos acorta
// la ruta, lo hace — así se destrancan las vueltas cuando hay varios
// negocios muy juntos y el vecino más cercano dejó uno "colgado".
function mejorarDosOpt(origen, rutaInicial){
  let ruta = rutaInicial;
  if(ruta.length < 3) return ruta;
  let mejorado = true;
  let vueltas = 0;
  while(mejorado && vueltas < 60){
    mejorado = false;
    vueltas++;
    for(let i = 0; i < ruta.length - 1; i++){
      for(let j = i + 1; j < ruta.length; j++){
        const candidata = ruta.slice(0, i).concat(ruta.slice(i, j + 1).reverse(), ruta.slice(j + 1));
        if(largoDeRuta(origen, candidata) < largoDeRuta(origen, ruta) - 1e-9){
          ruta = candidata;
          mejorado = true;
        }
      }
    }
  }
  return ruta;
}

// Or-opt: en vez de invertir un tramo (como 2-opt), prueba mover UN solo
// punto a otro lugar de la fila. Esto arregla casos que 2-opt no ve, como un
// negocio que quedó de pasada pero le conviene más visitarse justo después
// del más cercano a él, aunque eso no implique invertir ningún tramo.
function mejorarOrOpt(origen, rutaInicial){
  let ruta = rutaInicial;
  if(ruta.length < 3) return ruta;
  let mejorDist = largoDeRuta(origen, ruta);
  let mejorado = true;
  let vueltas = 0;
  while(mejorado && vueltas < 40){
    mejorado = false;
    vueltas++;
    for(let i = 0; i < ruta.length; i++){
      const nodo = ruta[i];
      const sinNodo = ruta.slice(0, i).concat(ruta.slice(i + 1));
      for(let j = 0; j <= sinNodo.length; j++){
        if(j === i) continue;
        const candidata = sinNodo.slice(0, j).concat([nodo], sinNodo.slice(j));
        const d = largoDeRuta(origen, candidata);
        if(d < mejorDist - 1e-9){
          ruta = candidata;
          mejorDist = d;
          mejorado = true;
        }
      }
    }
  }
  return ruta;
}

// Para selecciones chicas (hasta 9 paradas, que es el caso típico de una
// gira del día) probar TODOS los órdenes posibles es rápido y garantiza la
// ruta más corta real, no solo una buena aproximación.
function permutaciones(arr){
  if(arr.length <= 1) return [arr];
  const resultado = [];
  arr.forEach((item, i) => {
    const resto = arr.slice(0, i).concat(arr.slice(i + 1));
    permutaciones(resto).forEach(p => resultado.push([item, ...p]));
  });
  return resultado;
}

function optimizarRutaExacta(origen, puntos){
  let mejor = puntos;
  let mejorDist = Infinity;
  permutaciones(puntos).forEach(orden => {
    const d = largoDeRuta(origen, orden);
    if(d < mejorDist){ mejorDist = d; mejor = orden; }
  });
  return mejor;
}

const LIMITE_FUERZA_BRUTA = 9; // 9! ≈ 363k combinaciones, sigue siendo instantáneo

function optimizarRuta(origen, puntos){
  if(puntos.length < 2) return [...puntos];
  if(puntos.length <= LIMITE_FUERZA_BRUTA){
    return optimizarRutaExacta(origen, puntos);
  }
  // Para selecciones más grandes: una buena ruta inicial + dos rondas de
  // afinado (2-opt y or-opt) que se retroalimentan entre sí.
  let ruta = ordenarPorVecinoMasCercano(origen, puntos);
  ruta = mejorarDosOpt(origen, ruta);
  ruta = mejorarOrOpt(origen, ruta);
  ruta = mejorarDosOpt(origen, ruta);
  return ruta;
}

function calcularYMostrarRuta(){
  const seleccionados = prospectos.filter(p => seleccionRuta.has(p.id));
  if(seleccionados.length === 0){ mostrarToast('Selecciona al menos un prospecto'); return; }

  const construir = (origen) => {
    rutaCalculada = { origen, paradas: optimizarRuta(origen, seleccionados) };
    salirModoRutaEnMapa();
    cambiarTab('ruta');
  };

  if(navigator.geolocation){
    mostrarToast('Calculando la mejor ruta desde tu ubicación…');
    navigator.geolocation.getCurrentPosition(
      pos => construir({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      () => construir(null),
      { enableHighAccuracy: true, timeout: 6000 }
    );
  } else {
    construir(null);
  }
}

function renderRuta(){
  if(!rutaCalculada || rutaCalculada.paradas.length === 0){
    sheetBody.innerHTML = `<div class="empty">Toca el botón 🧭 del mapa, marca los prospectos a visitar hoy tocándolos, y presiona "Calcular ruta" en la barra de arriba.</div>`;
    return;
  }
  const { origen, paradas } = rutaCalculada;
  let distTotal = 0;
  let anterior = origen;
  const filas = paradas.map((p, i) => {
    const d = anterior ? distanciaKm(anterior, p) : 0;
    if(anterior) distTotal += d;
    anterior = { lat: p.lat, lng: p.lng };
    return `
      <div class="item" data-id="${p.id}">
        <span class="dot" style="background:${COLOR_ESTATUS[p.estatus]}; width:22px; height:22px; display:flex; align-items:center; justify-content:center; color:#0E1518; font-size:11px; font-weight:700;">${i + 1}</span>
        <div class="info">
          <div class="name">${escapeHtml(p.nombre)}</div>
          <div class="meta">${i === 0 && !origen ? 'Punto de partida' : d.toFixed(1) + ' km desde la parada anterior'}${p.municipio ? ' · ' + escapeHtml(p.municipio) : ''}</div>
        </div>
        <div class="fila-acciones">
          <button class="borrar-def" data-id="${p.id}" title="Eliminar definitivamente este prospecto">🗑</button>
          <button class="quitar-parada" data-id="${p.id}" title="Quitar de la ruta">✕</button>
        </div>
      </div>`;
  }).join('');

  sheetBody.innerHTML = `
    <div style="margin-bottom:12px;">
      <div style="font-weight:700; font-size:15px;">${paradas.length} paradas · ~${distTotal.toFixed(1)} km en línea recta</div>
      <div style="font-size:12px; color:var(--text-dim);">Ruta optimizada${origen ? ' desde tu ubicación actual' : ''} para evitar vueltas y cruces cuando hay negocios muy juntos. ✕ la quita solo de esta ruta; 🗑 la elimina definitivamente. La distancia es aproximada (línea recta, no por calles).</div>
    </div>
    ${filas}
    <div class="save-row" style="margin-top:14px;">
      <button class="btn primary" id="btnAbrirGoogleMaps" style="flex:2">📍 Abrir GPS (Google Maps)</button>
      <button class="btn danger" id="btnCancelarRuta">Cancelar</button>
    </div>
  `;

  sheetBody.querySelectorAll('.quitar-parada').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      quitarParadaDeRuta(btn.dataset.id);
    });
  });
  sheetBody.querySelectorAll('.borrar-def').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if(eliminarProspectoPorId(btn.dataset.id)) quitarParadaDeRuta(btn.dataset.id);
    });
  });
  sheetBody.querySelectorAll('.item').forEach(it => {
    it.addEventListener('click', () => {
      const parada = rutaCalculada.paradas.find(x => x.id === it.dataset.id);
      if(parada){ map.setView([parada.lat, parada.lng], 17); cerrarSheet(); }
    });
  });

  document.getElementById('btnAbrirGoogleMaps').addEventListener('click', abrirEnGoogleMaps);
  document.getElementById('btnCancelarRuta').addEventListener('click', () => {
    rutaCalculada = null;
    seleccionRuta.clear();
    salirModoRutaEnMapa();
    cambiarTab('lista');
  });
}

// Quita una parada de la ruta ya calculada, sin tener que rehacerla desde
// cero: se puede tocar la ✕ en la lista o el propio punto numerado en el mapa.
function quitarParadaDeRuta(id){
  if(!rutaCalculada) return;
  const restantes = rutaCalculada.paradas.filter(p => p.id !== id);
  seleccionRuta.delete(id);
  rutaCalculada = restantes.length === 0
    ? null
    : { origen: rutaCalculada.origen, paradas: optimizarRuta(rutaCalculada.origen, restantes) };
  renderMarcadores();
  if(currentTab === 'ruta') renderRuta();
  mostrarToast('Parada quitada de la ruta');
}

// Google Maps no tiene turn-by-turn "embebido" gratis, pero sí acepta un
// origen + varias paradas intermedias + destino por URL: le pasamos el
// orden que ya calculamos y él se encarga de la navegación real por calles.
function abrirEnGoogleMaps(){
  let { origen, paradas } = rutaCalculada;
  if(paradas.length === 0) return;

  if(paradas.length > 10){
    mostrarToast('Google Maps admite hasta 10 paradas por ruta; se abrirán las primeras 10');
    paradas = paradas.slice(0, 10);
  }

  const destino = paradas[paradas.length - 1];
  const intermedias = paradas.slice(0, -1);

  const params = new URLSearchParams();
  params.set('api', '1');
  if(origen) params.set('origin', `${origen.lat},${origen.lng}`);
  params.set('destination', `${destino.lat},${destino.lng}`);
  if(intermedias.length) params.set('waypoints', intermedias.map(p => `${p.lat},${p.lng}`).join('|'));
  params.set('travelmode', 'driving');

  // Antes usaba window.open(url, '_blank'): en un PWA instalado eso abre una
  // pestaña nueva dentro de la propia app, y al volver de Google Maps se
  // queda esa pestaña en blanco ("Buscar o ingresar sitio web"). Navegando
  // directo (location.href) no se crea esa pestaña extra: iOS intercepta el
  // enlace y abre la app de Google Maps sin dejar nada huérfano atrás.
  location.href = `https://www.google.com/maps/dir/?${params.toString()}`;
}

/* ---------- Importación: enrutador por tipo de archivo ---------- */
function manejarArchivoImportado(ev){
  const file = ev.target.files[0];
  ev.target.value = '';
  if(!file) return;

  const esCSV = /\.csv$/i.test(file.name) || file.type.includes('csv');
  const esJSON = /\.json$/i.test(file.name) || file.type.includes('json');

  if(esJSON){
    importarJSON(file);
  } else if(esCSV){
    pendingCSVFile = file;
    leerCSV(file, 'windows-1252');
  } else {
    mostrarToast('Usa un archivo .csv o .json. Si tienes .xlsx, guárdalo como CSV desde Excel');
  }
}

/* ---------- Fusión común (usada por JSON, CSV y el catálogo compartido) ---------- */
function fusionarImportados(datos, opts = {}){
  const silencioso = !!opts.silencioso;
  const existentes = new Set(prospectos.map(p => p.id));
  const excluidos = new Set(cargarDenueExcluidos());
  let nuevos = 0, actualizados = 0;
  datos.forEach(d => {
    if(!d.id || d.lat == null || d.lng == null || isNaN(d.lat) || isNaN(d.lng)) return;
    if(excluidos.has(d.id)) return; // se eliminó a propósito en este dispositivo: no se reintroduce
    if(existentes.has(d.id)){
      const i = prospectos.findIndex(p => p.id === d.id);
      // No se pisa el trabajo ya hecho en campo: solo se actualiza si sigue como estaba desde la importación
      if(prospectos[i].origen === 'DENUE' && !prospectos[i].pendienteSync){
        prospectos[i] = { ...prospectos[i], ...d };
        actualizados++;
      }
    } else {
      prospectos.push(d);
      nuevos++;
    }
  });

  guardarProspectos(prospectos);
  renderMarcadores();
  actualizarHeader();
  renderLista();

  if(!silencioso){
    mostrarToast(`Importado: ${nuevos} nuevos, ${actualizados} actualizados`);
    if(nuevos > 0 || actualizados > 0){ ajustarVistaATodos(); }
  } else if(nuevos > 0){
    // Primera vez que este dispositivo recibe el catálogo compartido: encuadra la vista.
    ajustarVistaATodos();
    mostrarToast(`Catálogo cargado: ${nuevos} ubicaciones`);
  }
}

/* ---------- Catálogo DENUE compartido (denue-import.json en el propio repo) ----------
   Este archivo se sube una sola vez al repositorio (junto con index.html) y cada
   dispositivo lo descarga solo al abrir la app: así el celular ve lo mismo que la PC
   sin tener que importar el archivo manualmente en cada equipo. Para actualizar el
   catálogo más adelante, basta con reemplazar denue-import.json en el repo y volver
   a publicar; los prospectos que ya se trabajaron en campo (pendienteSync) no se pisan. */
function cargarDenueCompartido(){
  fetch('denue-import.json', { cache: 'no-cache' })
    .then(r => r.ok ? r.json() : null)
    .then(datos => {
      if(Array.isArray(datos) && datos.length){
        fusionarImportados(datos, { silencioso: true });
      }
    })
    .catch(() => { /* sin señal: se queda con lo que ya haya guardado en este dispositivo */ });
}

/* ---------- Importar JSON (formato ya limpio, mismo esquema de la app) ---------- */
function importarJSON(file){
  const reader = new FileReader();
  reader.onload = () => {
    let datos;
    try{ datos = JSON.parse(reader.result); }
    catch(e){ mostrarToast('El archivo no es un JSON válido'); return; }
    if(!Array.isArray(datos)){ mostrarToast('Formato inesperado en el archivo'); return; }
    fusionarImportados(datos);
  };
  reader.readAsText(file);
}

/* ---------- Importar CSV con selector de columnas (como Google My Maps) ---------- */
let pendingCSVFile = null;
let importCSVState = null; // { headers, dataRows, encoding }

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if(c === '\r'){ /* se ignora, el salto real lo maneja \n */ }
      else { field += c; }
    }
  }
  if(field.length > 0 || row.length > 0){ row.push(field); rows.push(row); }
  return rows;
}

function leerCSV(file, encoding){
  const reader = new FileReader();
  reader.onload = () => {
    const filas = parseCSV(reader.result);
    if(filas.length < 2){ mostrarToast('El archivo no tiene datos'); return; }
    const headers = filas[0].map(h => h.trim());
    const dataRows = filas.slice(1).filter(r => r.some(v => v && v.trim() !== ''));
    importCSVState = { headers, dataRows, encoding };
    renderWizardCSV();
  };
  reader.onerror = () => mostrarToast('No se pudo leer el archivo');
  reader.readAsText(file, encoding);
}

function detectarColumna(headers, patron){
  return headers.find(h => patron.test(h)) || headers[0];
}

function finalizarImportacionCSV(){
  const { headers, dataRows } = importCSVState;
  const colNombre = document.getElementById('wNombre').value;
  const colLat = document.getElementById('wLat').value;
  const colLng = document.getElementById('wLng').value;
  const iN = headers.indexOf(colNombre);
  const iLa = headers.indexOf(colLat);
  const iLo = headers.indexOf(colLng);

  // Columnas de contexto que se detectan solas si existen (típicas del DENUE)
  const iId = headers.findIndex(h => /^id$/i.test(h));
  const iGiro = headers.findIndex(h => /clase de.*actividad|giro/i.test(h));
  const iEstrato = headers.findIndex(h => /estrato/i.test(h));
  const iTel = headers.findIndex(h => /tel[eé]fono/i.test(h));
  const iMunicipio = headers.findIndex(h => /^municipio$/i.test(h));
  const iLocalidad = headers.findIndex(h => /^localidad$/i.test(h));
  const iEntidad = headers.findIndex(h => /entidad federativa/i.test(h));

  const datos = dataRows.map((r, idx) => {
    const lat = parseFloat(String(r[iLa]).replace(',', '.'));
    const lng = parseFloat(String(r[iLo]).replace(',', '.'));
    const nombre = (r[iN] || '').trim();
    if(!nombre || isNaN(lat) || isNaN(lng)) return null;

    const notasParts = [iGiro, iEstrato, iTel]
      .map(i => i >= 0 ? (r[i] || '').trim() : '')
      .filter(Boolean);

    const id = iId >= 0 && r[iId] ? `denue_${r[iId].trim()}` : `csv_${idx}_${lat}_${lng}`;

    return {
      id,
      nombre,
      lat: Math.round(lat * 1e6) / 1e6,
      lng: Math.round(lng * 1e6) / 1e6,
      estatus: 'Prospecto',
      frecuencia: 'Ocasional',
      notas: notasParts.join(' · '),
      origen: 'DENUE',
      estado: iEntidad >= 0 ? tituloCase((r[iEntidad] || '').trim()) : undefined,
      municipio: iMunicipio >= 0 ? (r[iMunicipio] || '').trim() : undefined,
      localidad: iLocalidad >= 0 ? (r[iLocalidad] || '').trim() : undefined,
      fechaUltimaVisita: null,
      pendienteSync: false
    };
  }).filter(Boolean);

  importCSVState = null;
  pendingCSVFile = null;
  fusionarImportados(datos);
}

function tituloCase(s){
  return s.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());
}

function abrirDetalle(id){
  const p = prospectos.find(x => x.id === id);
  if(p) map.setView([p.lat, p.lng], Math.max(map.getZoom(), 16));
  editandoId = id;
  cambiarTab('alta');
}

/* ---------- Vista: Alta / edición ---------- */
function renderFormAlta(){
  const p = editandoId ? prospectos.find(x => x.id === editandoId) : null;
  if(p){ tempCoord = { lat: p.lat, lng: p.lng }; }

  sheetBody.innerHTML = `
    <div class="loc-row">
      <button class="btn primary" id="btnGPS">${p ? 'Corregir aquí (GPS)' : 'Usar mi ubicación (GPS)'}</button>
      <button class="btn" id="btnMapPick">Marcar en el mapa</button>
    </div>
    <div class="coord-pill" id="coordPill">${tempCoord ? `Ubicación lista: ${tempCoord.lat.toFixed(5)}, ${tempCoord.lng.toFixed(5)}` : ''}</div>

    <div class="field">
      <label>Nombre del negocio</label>
      <input type="text" id="fNombre" placeholder="Ej. Refaccionaria Los 3 Hermanos" value="${p ? escapeHtml(p.nombre) : ''}">
    </div>
    <div class="field">
      <label>Estatus</label>
      <select id="fEstatus">
        ${ESTATUS.map(e => `<option ${p && p.estatus===e ? 'selected':''}>${e}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>Frecuencia de visita</label>
      <select id="fFrecuencia">
        ${FRECUENCIA.map(f => `<option ${p && p.frecuencia===f ? 'selected':''}>${f}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>Notas</label>
      <textarea id="fNotas" placeholder="Referencias, contacto, horario…">${p ? escapeHtml(p.notas||'') : ''}</textarea>
    </div>
    <div class="field">
      <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
        <input type="checkbox" id="fPrioridad" ${p && p.prioridad ? 'checked' : ''} style="width:16px; height:16px;">
        ⚠️ Marcar como prioridad (ej. cotización pendiente, algo que no se debe olvidar)
      </label>
    </div>

    <div class="save-row">
      <button class="btn primary" id="btnGuardar" style="flex:2">Guardar</button>
      ${p ? '<button class="btn danger" id="btnEliminar">Eliminar</button>' : ''}
    </div>
  `;

  if(tempCoord){
    const pill = document.getElementById('coordPill');
    pill.style.display = 'block';
  }

  document.getElementById('btnGPS').addEventListener('click', usarGPSparaAlta);
  document.getElementById('btnMapPick').addEventListener('click', activarSeleccionEnMapa);
  document.getElementById('btnGuardar').addEventListener('click', guardarDesdeForm);
  const btnEliminar = document.getElementById('btnEliminar');
  if(btnEliminar) btnEliminar.addEventListener('click', eliminarActual);
}

function guardarDesdeForm(){
  const nombre = document.getElementById('fNombre').value.trim();
  const estatus = document.getElementById('fEstatus').value;
  const frecuencia = document.getElementById('fFrecuencia').value;
  const notas = document.getElementById('fNotas').value.trim();
  const prioridad = document.getElementById('fPrioridad').checked;

  if(!nombre){ mostrarToast('Falta el nombre del negocio'); return; }
  if(!tempCoord){ mostrarToast('Falta la ubicación: usa GPS o marca en el mapa'); return; }

  if(editandoId){
    const p = prospectos.find(x => x.id === editandoId);
    Object.assign(p, { nombre, estatus, frecuencia, notas, prioridad, lat: tempCoord.lat, lng: tempCoord.lng, pendienteSync: true, actualizadoEn: Date.now() });
    if(tempLugar){ p.municipio = tempLugar.municipio; p.localidad = tempLugar.localidad; }
  } else {
    prospectos.push({
      id: 'p_' + Date.now(),
      nombre, estatus, frecuencia, notas, prioridad,
      lat: tempCoord.lat, lng: tempCoord.lng,
      municipio: tempLugar ? tempLugar.municipio : '',
      localidad: tempLugar ? tempLugar.localidad : '',
      origen: 'Manual',
      fechaUltimaVisita: null,
      pendienteSync: true,
      actualizadoEn: Date.now()
    });
  }

  guardarProspectos(prospectos);
  renderMarcadores();
  actualizarHeader();
  if(tempMarker){ map.removeLayer(tempMarker); tempMarker = null; }
  tempCoord = null;
  tempLugar = null;
  editandoId = null;
  mostrarToast('Guardado localmente');
  cambiarTab('lista');
  syncPendientes();
}

// Reutilizada por el formulario de edición y por "eliminar definitivamente"
// desde la vista de Ruta, para no repetir la misma lógica dos veces.
function eliminarProspectoPorId(id){
  const p = prospectos.find(x => x.id === id);
  const nombre = p ? p.nombre : 'esta ubicación';
  if(!confirm(`¿Eliminar definitivamente "${nombre}"? Ya no aparecerá en el mapa ni en la lista.`)) return false;
  if(p && p.origen === 'DENUE') agregarDenueExcluido(id);
  prospectos = prospectos.filter(x => x.id !== id);
  seleccionRuta.delete(id);
  const eliminados = cargarPendientesEliminar();
  eliminados.push(id);
  guardarPendientesEliminar(eliminados);
  guardarProspectos(prospectos);
  renderMarcadores();
  actualizarHeader();
  mostrarToast('Prospecto eliminado');
  syncPendientes();
  return true;
}

function eliminarActual(){
  if(eliminarProspectoPorId(editandoId)){
    editandoId = null;
    cambiarTab('lista');
  }
}

/* ---------- Header / sincronización ---------- */
function actualizarHeader(){
  document.getElementById('headerSub').textContent = `${prospectos.length} registrados`;
  const pendientes = prospectos.filter(p => p.pendienteSync).length + cargarPendientesEliminar().length;
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  if(!navigator.onLine){
    dot.classList.remove('pend');
    dot.classList.add('offline');
    txt.textContent = 'Sin conexión';
    return;
  }
  dot.classList.remove('offline');
  if(!SHEET_ENDPOINT){
    dot.classList.toggle('pend', pendientes > 0);
    txt.textContent = pendientes > 0 ? `${pendientes} sin sincronizar` : 'Local';
  } else {
    dot.classList.toggle('pend', pendientes > 0 || sincronizando);
    txt.textContent = sincronizando ? 'Sincronizando…' : (pendientes > 0 ? `${pendientes} por subir` : 'Sincronizado');
  }
}
window.addEventListener('online', () => { actualizarHeader(); syncPendientes(); });
document.getElementById('syncWrap').addEventListener('click', () => {
  if(!SHEET_ENDPOINT){ mostrarToast('Aún no hay Sheet compartido configurado (todo vive local en este dispositivo)'); return; }
  if(!navigator.onLine){ mostrarToast('Sin señal ahora mismo'); return; }
  mostrarToast('Buscando cambios de otros dispositivos…');
  syncPendientes();
});
window.addEventListener('offline', actualizarHeader);

/* ---------- Toast ---------- */
let toastTimer = null;
function mostrarToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- Arranque ---------- */
cerrarSheet(); // estado conocido: nunca debe arrancar abierta de por sí
renderSheetTabs();
renderMarcadores();
actualizarHeader();
renderLista();
if(prospectos.length > 0){ ajustarVistaATodos(); }
cargarDenueCompartido();
syncPendientes();
setInterval(syncPendientes, 5 * 60 * 1000); // reintenta cada 5 min mientras la app siga abierta

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
