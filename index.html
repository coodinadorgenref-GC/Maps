<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Prospectos & Rutas GC</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14181C">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#14181C;
    --surface:#1E242B;
    --surface-2:#262D35;
    --line: #333B44;
    --text:#EDEFF1;
    --text-dim:#9AA4AE;
    --accent:#C4D600;
    --accent-ink:#14181C;
    --teal:#4FA8A0;
    --ochre:#FF8A1E;
    --danger:#D65F5F;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
  }
  header{
    position:fixed; top:0; left:0; right:0; z-index:1200;
    display:flex; align-items:center; justify-content:space-between;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    background:linear-gradient(180deg, rgba(20,24,28,.95), rgba(20,24,28,.75));
    backdrop-filter: blur(6px);
  }
  header h1{
    font-size:16px; font-weight:700; letter-spacing:-0.2px; margin:0;
  }
  header .sub{
    font-size:11.5px; color:var(--text-dim); margin-top:1px;
  }
  .sync-dot{
    width:9px; height:9px; border-radius:50%; background:var(--text-dim);
    box-shadow:0 0 0 3px rgba(255,255,255,.04);
  }
  .sync-dot.pend{background:var(--ochre);}
  .sync-dot.offline{background:var(--danger);}
  .sync-wrap{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--text-dim);}

  #map{ position:absolute; inset:0; }
  .leaflet-control-attribution{ font-size:9px; }

  .fab{
    position:fixed; right:16px; bottom:96px; z-index:1200;
    width:56px; height:56px; border-radius:50%;
    background:var(--accent); color:var(--accent-ink);
    border:none; font-size:28px; font-weight:600; line-height:1;
    box-shadow:0 6px 18px rgba(0,0,0,.4);
  }
  .fab:active{ transform: scale(.95); }

  .locate-fab{
    position:fixed; right:16px; bottom:164px; z-index:1200;
    width:44px; height:44px; border-radius:50%;
    background:var(--surface); color:var(--text);
    border:1px solid var(--line); font-size:18px;
    box-shadow:0 6px 14px rgba(0,0,0,.35);
  }
  .fit-fab{
    position:fixed; right:16px; bottom:216px; z-index:1200;
    width:44px; height:44px; border-radius:50%;
    background:var(--surface); color:var(--text);
    border:1px solid var(--line); font-size:16px;
    box-shadow:0 6px 14px rgba(0,0,0,.35);
  }
  .zone-fab{
    position:fixed; right:16px; bottom:268px; z-index:1200;
    width:44px; height:44px; border-radius:50%;
    background:var(--surface); color:var(--text);
    border:1px solid var(--line); font-size:16px;
    box-shadow:0 6px 14px rgba(0,0,0,.35);
  }

  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:1300;
    background:var(--surface);
    border-radius:18px 18px 0 0;
    border-top:1px solid var(--line);
    box-shadow:0 -8px 24px rgba(0,0,0,.4);
    max-height:82vh;
    transform: translateY(calc(100% - 74px));
    transition: transform .25s ease;
    display:flex; flex-direction:column;
  }
  .sheet.open{ transform: translateY(0); }
  .sheet-handle{
    padding:10px 16px 6px; cursor:pointer;
    display:flex; align-items:center; justify-content:space-between;
  }
  .sheet-handle .bar{
    width:36px; height:4px; border-radius:2px; background:var(--line);
    margin: 0 auto;
  }
  .sheet-tabs{
    display:flex; gap:6px; padding:0 14px 10px;
    border-bottom:1px solid var(--line);
  }
  .tab{
    flex:1; text-align:center; padding:9px 0; border-radius:10px;
    font-size:13px; color:var(--text-dim); background:transparent; border:none;
  }
  .tab.active{ background:var(--surface-2); color:var(--text); font-weight:600; }
  .sheet-body{ overflow-y:auto; padding:14px 16px 24px; }

  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12px; color:var(--text-dim); margin-bottom:5px; }
  .field input[type=text], .field textarea, .field select{
    width:100%; background:var(--surface-2); border:1px solid var(--line);
    color:var(--text); border-radius:10px; padding:10px 11px; font-size:14.5px;
    font-family:inherit;
  }
  .field textarea{ min-height:64px; resize:vertical; }

  .loc-row{ display:flex; gap:8px; margin-bottom:14px; }
  .btn{
    border:none; border-radius:10px; padding:10px 14px; font-size:13.5px;
    font-weight:600; color:var(--text); background:var(--surface-2);
    border:1px solid var(--line); flex:1;
  }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); border:none; }
  .btn.teal{ background:transparent; color:var(--teal); border:1px solid var(--teal); }
  .btn.danger{ background:transparent; color:var(--danger); border:1px solid var(--danger); }
  .btn:active{ filter:brightness(.92); }

  .coord-pill{
    font-size:12px; color:var(--teal); background:rgba(79,168,160,.12);
    border:1px solid rgba(79,168,160,.35); border-radius:8px; padding:6px 10px;
    margin-bottom:12px; display:none;
  }

  .save-row{ display:flex; gap:8px; margin-top:6px; }

  .chip-row{ display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; margin-bottom:6px; }
  .chip{
    white-space:nowrap; font-size:12px; padding:6px 11px; border-radius:20px;
    background:var(--surface-2); color:var(--text-dim); border:1px solid var(--line);
  }
  .chip.active{ background:var(--teal); color:#0E1518; border-color:var(--teal); font-weight:600; }

  .item{
    display:flex; align-items:center; gap:10px;
    padding:11px 4px; border-bottom:1px solid var(--line);
  }
  .item .dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .item .info{ flex:1; min-width:0; }
  .item .name{ font-size:14.5px; font-weight:600; }
  .item .meta{ font-size:12px; color:var(--text-dim); }
  .item .go{ font-size:18px; color:var(--text-dim); padding:6px; }

  .empty{ text-align:center; color:var(--text-dim); font-size:13.5px; padding:30px 10px; }

  .toast{
    position:fixed; left:50%; bottom:180px; transform:translateX(-50%);
    background:var(--surface-2); color:var(--text); padding:10px 16px;
    border-radius:10px; font-size:13px; border:1px solid var(--line);
    z-index:1500; opacity:0; transition:opacity .2s ease; pointer-events:none;
  }
  .toast.show{ opacity:1; }

  .pick-banner{
    position:fixed; top:0; left:0; right:0; z-index:1400;
    background:var(--teal); color:#0E1518; text-align:center;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    font-size:13.5px; font-weight:600; display:none;
  }
</style>
</head>
<body>

<div id="pickBanner" class="pick-banner">Toca un punto en el mapa para marcar la ubicación</div>

<header>
  <div>
    <h1>Prospectos & Rutas</h1>
    <div class="sub" id="headerSub">0 registrados</div>
  </div>
  <div class="sync-wrap">
    <span class="sync-dot" id="syncDot"></span>
    <span id="syncText">Local</span>
  </div>
</header>

<div id="map"></div>

<button class="locate-fab" id="btnLocate" title="Centrar en mi ubicación">◎</button>
<button class="fit-fab" id="btnFit" title="Ver todos los prospectos">⤢</button>
<button class="zone-fab" id="btnZonaOffline" title="Guardar el mapa de esta zona para trabajar sin señal">⬇</button>
<button class="fab" id="btnAdd" title="Agregar prospecto">+</button>

<div class="sheet" id="sheet">
  <div class="sheet-handle" id="sheetHandle">
    <div class="bar"></div>
  </div>
  <div class="sheet-tabs">
    <button class="tab active" data-tab="lista">Lista</button>
    <button class="tab" data-tab="alta">Agregar</button>
    <button class="tab" data-tab="ruta">Ruta</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ---------- Estado y almacenamiento local ---------- */
const STORAGE_KEY = 'gc_prospectos_v1';
// TODO: cuando esté listo el Apps Script del Sheet, poner aquí la URL del
// Web App y activar syncPendientes(). Mientras tanto todo vive local.
const SHEET_ENDPOINT = '';

function cargarProspectos(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch(e){ return []; }
}
function guardarProspectos(lista){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(lista));
}
let prospectos = cargarProspectos();

const ESTATUS = ['Prospecto','Visitado','Cliente','Descartado'];
const FRECUENCIA = ['Ocasional','Mensual','Semanal'];
const COLOR_ESTATUS = {
  'Prospecto': '#FF8A1E',
  'Visitado':  '#2FA89D',
  'Cliente':   '#C4D600',
  'Descartado':'#8A94A0'
};
const ESTADOS = ['Yucatán','Quintana Roo'];

/* ---------- Mapa ---------- */
const map = L.map('map', { zoomControl:false, attributionControl:true })
  .setView([20.70, -89.10], 9); // centrado aprox. en Yucatán

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

L.control.zoom({ position:'bottomleft' }).addTo(map);

const markersLayer = L.layerGroup().addTo(map);
let userMarker = null;

function pasaFiltro(p){
  const okEstatus = estadoFiltro.estatus === 'Todos' || p.estatus === estadoFiltro.estatus;
  const okEstado = estadoFiltro.estado === 'Todos' || !p.estado || p.estado === estadoFiltro.estado;
  return okEstatus && okEstado;
}

function renderMarcadores(){
  markersLayer.clearLayers();
  prospectos
    .filter(pasaFiltro)
    .forEach(p => {
      const esDenue = p.origen === 'DENUE';
      const m = L.circleMarker([p.lat, p.lng], {
        radius: esDenue ? 7 : 9,
        color: '#FFFFFF',
        weight: esDenue ? 1.5 : 2.5,
        fillColor: COLOR_ESTATUS[p.estatus] || '#9AA4AE',
        fillOpacity: esDenue ? 0.92 : 0.97
      }).bindPopup(`<b>${escapeHtml(p.nombre)}</b><br>${p.estatus} · ${p.frecuencia}<br><span style="color:#9AA4AE">${p.origen}${p.municipio ? ' · ' + escapeHtml(p.municipio) : ''}</span>`);
      m.on('click', () => abrirDetalle(p.id));
      markersLayer.addLayer(m);
    });
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

/* ---------- Selección de ubicación (GPS o toque en mapa) ---------- */
let pickingLocation = false;
let tempCoord = null;
let tempMarker = null;

document.getElementById('btnLocate').addEventListener('click', () => {
  centrarEnMiUbicacion();
});

document.getElementById('btnFit').addEventListener('click', () => {
  ajustarVistaATodos();
});

document.getElementById('btnZonaOffline').addEventListener('click', descargarZonaSinSenal);

/* ---------- Guardar tiles del mapa para trabajar sin señal ----------
   En carretera/poblados sin cobertura, Leaflet no puede pedir tiles nuevos.
   Este botón descarga por adelantado (mientras haya señal) los recuadros del
   mapa de la zona visible, en un rango de zooms, y los deja en la misma caché
   que usa el service worker (rutas-gc-tiles-v1) para que se sirvan solos
   cuando no haya conexión. */
const TILES_CACHE_NAME = 'rutas-gc-tiles-v1'; // debe coincidir con CACHE_TILES en sw.js

function latLngATile(lat, lng, zoom){
  const n = Math.pow(2, zoom);
  const x = Math.floor((lng + 180) / 360 * n);
  const latRad = lat * Math.PI / 180;
  const y = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n);
  return { x: Math.max(0, Math.min(n - 1, x)), y: Math.max(0, Math.min(n - 1, y)) };
}

async function descargarZonaSinSenal(){
  if(!('caches' in window)){ mostrarToast('Este navegador no permite guardar mapas sin conexión'); return; }
  if(!navigator.onLine){ mostrarToast('Necesitas señal ahora para guardar el mapa de esta zona'); return; }

  const zoomBase = map.getZoom();
  const zooms = [...new Set([
    Math.max(zoomBase - 1, 10), zoomBase, Math.min(zoomBase + 1, 17), Math.min(zoomBase + 2, 17)
  ])];
  const bounds = map.getBounds();
  const subdominios = ['a', 'b', 'c'];

  mostrarToast('Descargando mapa de esta zona…');
  const cache = await caches.open(TILES_CACHE_NAME);
  let total = 0;
  const tareas = [];

  zooms.forEach(z => {
    const nwTile = latLngATile(bounds.getNorth(), bounds.getWest(), z);
    const seTile = latLngATile(bounds.getSouth(), bounds.getEast(), z);
    for(let x = nwTile.x; x <= seTile.x; x++){
      for(let y = nwTile.y; y <= seTile.y; y++){
        const s = subdominios[(x + y) % subdominios.length];
        const url = `https://${s}.tile.openstreetmap.org/${z}/${x}/${y}.png`;
        total++;
        tareas.push(fetch(url, { mode: 'no-cors' }).then(r => cache.put(url, r)).catch(() => {}));
      }
    }
  });

  await Promise.all(tareas);
  mostrarToast(`Zona guardada: ${total} recuadros de mapa listos para sin señal`);
}

function ajustarVistaATodos(){
  const visibles = prospectos.filter(pasaFiltro);
  if(visibles.length === 0){
    mostrarToast('No hay prospectos que mostrar con el filtro actual');
    return;
  }
  const bounds = L.latLngBounds(visibles.map(p => [p.lat, p.lng]));
  map.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
}

function centrarEnMiUbicacion(){
  if(!navigator.geolocation){ mostrarToast('Este dispositivo no soporta GPS'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const {latitude, longitude} = pos.coords;
    map.setView([latitude, longitude], 15);
    if(userMarker) map.removeLayer(userMarker);
    userMarker = L.circleMarker([latitude, longitude], {
      radius:7, color:'#fff', weight:2, fillColor:'#4FA8A0', fillOpacity:1
    }).addTo(map);
  }, () => mostrarToast('No se pudo obtener tu ubicación'), { enableHighAccuracy:true, timeout:8000 });
}

function usarGPSparaAlta(){
  if(!navigator.geolocation){ mostrarToast('Este dispositivo no soporta GPS'); return; }
  mostrarToast('Obteniendo ubicación…');
  navigator.geolocation.getCurrentPosition(pos => {
    fijarCoordTemporal(pos.coords.latitude, pos.coords.longitude);
    map.setView([pos.coords.latitude, pos.coords.longitude], 16);
    if(editandoId){
      // Estar parado frente al negocio ya es una visita: se sugiere el estatus,
      // pero se puede cambiar manualmente si no aplica.
      const sel = document.getElementById('fEstatus');
      if(sel && sel.value === 'Prospecto') sel.value = 'Visitado';
    }
  }, () => mostrarToast('No se pudo obtener tu ubicación'), { enableHighAccuracy:true, timeout:8000 });
}

function activarSeleccionEnMapa(){
  pickingLocation = true;
  document.getElementById('pickBanner').style.display = 'block';
  cerrarSheet();
}

map.on('click', (e) => {
  if(!pickingLocation) return;
  pickingLocation = false;
  document.getElementById('pickBanner').style.display = 'none';
  fijarCoordTemporal(e.latlng.lat, e.latlng.lng);
  abrirSheet();
  cambiarTab('alta');
});

function fijarCoordTemporal(lat, lng){
  tempCoord = { lat, lng };
  if(tempMarker) map.removeLayer(tempMarker);
  tempMarker = L.marker([lat, lng]).addTo(map);
  const pill = document.getElementById('coordPill');
  if(pill){
    pill.style.display = 'block';
    pill.textContent = `Ubicación lista: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  }
}

/* ---------- Bottom sheet ---------- */
const sheet = document.getElementById('sheet');
const sheetBody = document.getElementById('sheetBody');
let currentTab = 'lista';
let estadoFiltro = { estatus: 'Todos', estado: 'Todos' };
let editandoId = null;
let modoRuta = false;
let seleccionRuta = new Set();
let rutaCalculada = null;

habilitarArrastreSheet();
document.getElementById('btnAdd').addEventListener('click', () => {
  editandoId = null;
  tempCoord = null;
  if(tempMarker){ map.removeLayer(tempMarker); tempMarker = null; }
  abrirSheet();
  cambiarTab('alta');
});

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => cambiarTab(btn.dataset.tab));
});

function abrirSheet(){ sheet.classList.add('open'); }
function cerrarSheet(){ sheet.classList.remove('open'); }
function toggleSheet(){ sheet.classList.toggle('open'); }

function habilitarArrastreSheet(){
  const handle = document.getElementById('sheetHandle');
  let startY = null;
  let startHeight = 0;

  const onMove = (e) => {
    if(startY === null) return;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const delta = clientY - startY;
    const isOpen = sheet.classList.contains('open');
    const base = isOpen ? 0 : startHeight - 74;
    let newY = base + delta;
    newY = Math.max(0, Math.min(startHeight - 74, newY));
    sheet.style.transition = 'none';
    sheet.style.transform = `translateY(${newY}px)`;
  };

  const onEnd = (e) => {
    if(startY === null) return;
    const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
    const delta = clientY - startY;
    const isOpenBefore = sheet.classList.contains('open');
    const threshold = 55;

    sheet.style.transition = '';
    sheet.style.transform = '';

    if(Math.abs(delta) < 8){
      sheet.classList.toggle('open', !isOpenBefore);
    } else if(delta < -threshold){
      sheet.classList.add('open');
    } else if(delta > threshold){
      sheet.classList.remove('open');
    } else {
      sheet.classList.toggle('open', isOpenBefore);
    }

    startY = null;
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onEnd);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onEnd);
  };

  const onStart = (e) => {
    startY = e.touches ? e.touches[0].clientY : e.clientY;
    startHeight = sheet.offsetHeight;
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
    document.addEventListener('touchmove', onMove, { passive:true });
    document.addEventListener('touchend', onEnd);
  };

  handle.addEventListener('mousedown', onStart);
  handle.addEventListener('touchstart', onStart, { passive:true });
}

function cambiarTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  abrirSheet();
  if(tab === 'lista') renderLista();
  if(tab === 'alta') renderFormAlta();
  if(tab === 'ruta') renderRuta();
}

/* ---------- Vista: Lista ---------- */
function renderLista(){
  const chipsEstatus = ['Todos', ...ESTATUS].map(e =>
    `<button class="chip ${estadoFiltro.estatus===e?'active':''}" data-tipo="estatus" data-valor="${e}">${e}</button>`
  ).join('');
  const chipsEstado = ['Todos', ...ESTADOS].map(e =>
    `<button class="chip ${estadoFiltro.estado===e?'active':''}" data-tipo="estado" data-valor="${e}">${e}</button>`
  ).join('');

  const items = prospectos
    .filter(pasaFiltro)
    .map(p => `
      <div class="item" data-id="${p.id}">
        ${modoRuta
          ? `<input type="checkbox" class="chk-ruta" data-id="${p.id}" ${seleccionRuta.has(p.id) ? 'checked' : ''}>`
          : `<span class="dot" style="background:${COLOR_ESTATUS[p.estatus]}"></span>`}
        <div class="info">
          <div class="name">${escapeHtml(p.nombre)}</div>
          <div class="meta">${p.estatus} · ${p.frecuencia} · ${p.origen}${p.municipio ? ' · ' + escapeHtml(p.municipio) : ''}${p.pendienteSync ? ' · sin sincronizar' : ''}</div>
        </div>
        ${modoRuta ? '' : '<span class="go">›</span>'}
      </div>
    `).join('');

  sheetBody.innerHTML = `
    <div class="chip-row">${chipsEstatus}</div>
    <div class="chip-row">${chipsEstado}</div>
    <div class="save-row" style="margin-bottom:10px">
      <button class="btn ${modoRuta ? 'teal' : ''}" id="btnModoRuta" style="flex:1">${modoRuta ? 'Cancelar selección' : 'Planear ruta'}</button>
      <button class="btn primary" id="btnImportar" style="flex:1">Importar otra lista (CSV / JSON)</button>
    </div>
    ${modoRuta && seleccionRuta.size > 0 ? `
    <div class="save-row" style="margin-bottom:10px">
      <button class="btn primary" id="btnCalcularRuta" style="flex:1">Calcular ruta (${seleccionRuta.size})</button>
    </div>` : ''}
    <input type="file" id="fileImportar" accept=".csv,.json,text/csv,application/json,application/vnd.ms-excel,text/plain" style="display:none">
    ${items || '<div class="empty">Aún no hay prospectos registrados.<br>Toca “Agregar” o el botón + del mapa, o importa tu DENUE.</div>'}
  `;

  sheetBody.querySelectorAll('.chip').forEach(c => {
    c.addEventListener('click', () => {
      estadoFiltro[c.dataset.tipo] = c.dataset.valor;
      renderLista();
      renderMarcadores();
    });
  });

  if(modoRuta){
    sheetBody.querySelectorAll('.chk-ruta').forEach(chk => {
      chk.addEventListener('click', (e) => e.stopPropagation());
      chk.addEventListener('change', () => {
        if(chk.checked) seleccionRuta.add(chk.dataset.id); else seleccionRuta.delete(chk.dataset.id);
        renderLista();
      });
    });
    sheetBody.querySelectorAll('.item').forEach(it => {
      it.addEventListener('click', () => {
        const id = it.dataset.id;
        if(seleccionRuta.has(id)) seleccionRuta.delete(id); else seleccionRuta.add(id);
        renderLista();
      });
    });
    const btnCalc = document.getElementById('btnCalcularRuta');
    if(btnCalc) btnCalc.addEventListener('click', calcularYMostrarRuta);
  } else {
    sheetBody.querySelectorAll('.item').forEach(it => {
      it.addEventListener('click', () => abrirDetalle(it.dataset.id));
    });
  }

  document.getElementById('btnModoRuta').addEventListener('click', () => {
    modoRuta = !modoRuta;
    if(!modoRuta) seleccionRuta.clear();
    renderLista();
  });

  const fileInput = document.getElementById('fileImportar');
  document.getElementById('btnImportar').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', manejarArchivoImportado);
}

/* ---------- Vista: Ruta (selección de prospectos + orden sugerido) ---------- */
function distanciaKm(a, b){
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

// Heurística del vecino más cercano: no es la ruta perfecta, pero evita ir y
// venir sobre los mismos tramos, que es justo el problema a resolver aquí.
function ordenarPorVecinoMasCercano(origen, puntos){
  const restantes = [...puntos];
  const orden = [];
  let actual = origen;
  if(!actual && restantes.length){
    actual = { lat: restantes[0].lat, lng: restantes[0].lng };
    orden.push(restantes.shift());
  }
  while(restantes.length){
    let mejorIdx = 0, mejorDist = Infinity;
    restantes.forEach((p, i) => {
      const d = distanciaKm(actual, p);
      if(d < mejorDist){ mejorDist = d; mejorIdx = i; }
    });
    const siguiente = restantes.splice(mejorIdx, 1)[0];
    orden.push(siguiente);
    actual = { lat: siguiente.lat, lng: siguiente.lng };
  }
  return orden;
}

function calcularYMostrarRuta(){
  const seleccionados = prospectos.filter(p => seleccionRuta.has(p.id));
  if(seleccionados.length === 0){ mostrarToast('Selecciona al menos un prospecto'); return; }

  const construir = (origen) => {
    rutaCalculada = { origen, paradas: ordenarPorVecinoMasCercano(origen, seleccionados) };
    cambiarTab('ruta');
  };

  if(navigator.geolocation){
    mostrarToast('Calculando ruta desde tu ubicación…');
    navigator.geolocation.getCurrentPosition(
      pos => construir({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      () => construir(null),
      { enableHighAccuracy: true, timeout: 6000 }
    );
  } else {
    construir(null);
  }
}

function renderRuta(){
  if(!rutaCalculada || rutaCalculada.paradas.length === 0){
    sheetBody.innerHTML = `<div class="empty">Ve a “Lista”, toca “Planear ruta”, elige los prospectos a visitar hoy y presiona “Calcular ruta”.</div>`;
    return;
  }
  const { origen, paradas } = rutaCalculada;
  let distTotal = 0;
  let anterior = origen;
  const filas = paradas.map((p, i) => {
    const d = anterior ? distanciaKm(anterior, p) : 0;
    if(anterior) distTotal += d;
    anterior = { lat: p.lat, lng: p.lng };
    return `
      <div class="item">
        <span class="dot" style="background:${COLOR_ESTATUS[p.estatus]}; width:22px; height:22px; display:flex; align-items:center; justify-content:center; color:#0E1518; font-size:11px; font-weight:700;">${i + 1}</span>
        <div class="info">
          <div class="name">${escapeHtml(p.nombre)}</div>
          <div class="meta">${i === 0 && !origen ? 'Punto de partida' : d.toFixed(1) + ' km desde la parada anterior'}${p.municipio ? ' · ' + escapeHtml(p.municipio) : ''}</div>
        </div>
      </div>`;
  }).join('');

  sheetBody.innerHTML = `
    <div style="margin-bottom:12px;">
      <div style="font-weight:700; font-size:15px;">${paradas.length} paradas · ~${distTotal.toFixed(1)} km en línea recta</div>
      <div style="font-size:12px; color:var(--text-dim);">Orden sugerido por cercanía${origen ? ' desde tu ubicación actual' : ''} para no cruzar tu propio camino. La distancia es aproximada (línea recta, no por calles).</div>
    </div>
    ${filas}
    <div class="save-row" style="margin-top:14px;">
      <button class="btn primary" id="btnAbrirGoogleMaps" style="flex:2">Abrir ruta en Google Maps</button>
      <button class="btn danger" id="btnCancelarRuta">Cancelar</button>
    </div>
  `;

  document.getElementById('btnAbrirGoogleMaps').addEventListener('click', abrirEnGoogleMaps);
  document.getElementById('btnCancelarRuta').addEventListener('click', () => {
    rutaCalculada = null;
    seleccionRuta.clear();
    modoRuta = false;
    cambiarTab('lista');
  });
}

// Google Maps no tiene turn-by-turn "embebido" gratis, pero sí acepta un
// origen + varias paradas intermedias + destino por URL: le pasamos el
// orden que ya calculamos y él se encarga de la navegación real por calles.
function abrirEnGoogleMaps(){
  let { origen, paradas } = rutaCalculada;
  if(paradas.length === 0) return;

  if(paradas.length > 10){
    mostrarToast('Google Maps admite hasta 10 paradas por ruta; se abrirán las primeras 10');
    paradas = paradas.slice(0, 10);
  }

  const destino = paradas[paradas.length - 1];
  const intermedias = paradas.slice(0, -1);

  const params = new URLSearchParams();
  params.set('api', '1');
  if(origen) params.set('origin', `${origen.lat},${origen.lng}`);
  params.set('destination', `${destino.lat},${destino.lng}`);
  if(intermedias.length) params.set('waypoints', intermedias.map(p => `${p.lat},${p.lng}`).join('|'));
  params.set('travelmode', 'driving');

  window.open(`https://www.google.com/maps/dir/?${params.toString()}`, '_blank');
}

/* ---------- Importación: enrutador por tipo de archivo ---------- */
function manejarArchivoImportado(ev){
  const file = ev.target.files[0];
  ev.target.value = '';
  if(!file) return;

  const esCSV = /\.csv$/i.test(file.name) || file.type.includes('csv');
  const esJSON = /\.json$/i.test(file.name) || file.type.includes('json');

  if(esJSON){
    importarJSON(file);
  } else if(esCSV){
    pendingCSVFile = file;
    leerCSV(file, 'windows-1252');
  } else {
    mostrarToast('Usa un archivo .csv o .json. Si tienes .xlsx, guárdalo como CSV desde Excel');
  }
}

/* ---------- Fusión común (usada por JSON, CSV y el catálogo compartido) ---------- */
function fusionarImportados(datos, opts = {}){
  const silencioso = !!opts.silencioso;
  const existentes = new Set(prospectos.map(p => p.id));
  let nuevos = 0, actualizados = 0;
  datos.forEach(d => {
    if(!d.id || d.lat == null || d.lng == null || isNaN(d.lat) || isNaN(d.lng)) return;
    if(existentes.has(d.id)){
      const i = prospectos.findIndex(p => p.id === d.id);
      // No se pisa el trabajo ya hecho en campo: solo se actualiza si sigue como estaba desde la importación
      if(prospectos[i].origen === 'DENUE' && !prospectos[i].pendienteSync){
        prospectos[i] = { ...prospectos[i], ...d };
        actualizados++;
      }
    } else {
      prospectos.push(d);
      nuevos++;
    }
  });

  guardarProspectos(prospectos);
  renderMarcadores();
  actualizarHeader();
  renderLista();

  if(!silencioso){
    mostrarToast(`Importado: ${nuevos} nuevos, ${actualizados} actualizados`);
    if(nuevos > 0 || actualizados > 0){ ajustarVistaATodos(); }
  } else if(nuevos > 0){
    // Primera vez que este dispositivo recibe el catálogo compartido: encuadra la vista.
    ajustarVistaATodos();
    mostrarToast(`Catálogo cargado: ${nuevos} ubicaciones`);
  }
}

/* ---------- Catálogo DENUE compartido (denue-import.json en el propio repo) ----------
   Este archivo se sube una sola vez al repositorio (junto con index.html) y cada
   dispositivo lo descarga solo al abrir la app: así el celular ve lo mismo que la PC
   sin tener que importar el archivo manualmente en cada equipo. Para actualizar el
   catálogo más adelante, basta con reemplazar denue-import.json en el repo y volver
   a publicar; los prospectos que ya se trabajaron en campo (pendienteSync) no se pisan. */
function cargarDenueCompartido(){
  fetch('denue-import.json', { cache: 'no-cache' })
    .then(r => r.ok ? r.json() : null)
    .then(datos => {
      if(Array.isArray(datos) && datos.length){
        fusionarImportados(datos, { silencioso: true });
      }
    })
    .catch(() => { /* sin señal: se queda con lo que ya haya guardado en este dispositivo */ });
}

/* ---------- Importar JSON (formato ya limpio, mismo esquema de la app) ---------- */
function importarJSON(file){
  const reader = new FileReader();
  reader.onload = () => {
    let datos;
    try{ datos = JSON.parse(reader.result); }
    catch(e){ mostrarToast('El archivo no es un JSON válido'); return; }
    if(!Array.isArray(datos)){ mostrarToast('Formato inesperado en el archivo'); return; }
    fusionarImportados(datos);
  };
  reader.readAsText(file);
}

/* ---------- Importar CSV con selector de columnas (como Google My Maps) ---------- */
let pendingCSVFile = null;
let importCSVState = null; // { headers, dataRows, encoding }

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if(c === '\r'){ /* se ignora, el salto real lo maneja \n */ }
      else { field += c; }
    }
  }
  if(field.length > 0 || row.length > 0){ row.push(field); rows.push(row); }
  return rows;
}

function leerCSV(file, encoding){
  const reader = new FileReader();
  reader.onload = () => {
    const filas = parseCSV(reader.result);
    if(filas.length < 2){ mostrarToast('El archivo no tiene datos'); return; }
    const headers = filas[0].map(h => h.trim());
    const dataRows = filas.slice(1).filter(r => r.some(v => v && v.trim() !== ''));
    importCSVState = { headers, dataRows, encoding };
    renderWizardCSV();
  };
  reader.onerror = () => mostrarToast('No se pudo leer el archivo');
  reader.readAsText(file, encoding);
}

function detectarColumna(headers, patron){
  return headers.find(h => patron.test(h)) || headers[0];
}

function renderWizardCSV(){
  const { headers, dataRows } = importCSVState;
  const autoNombre = detectarColumna(headers, /nombre.*unidad|^nombre$|t[ií]tulo/i);
  const autoLat = detectarColumna(headers, /latitud|^lat$/i);
  const autoLng = detectarColumna(headers, /longitud|^lng$|^lon$/i);

  const opciones = (sel) => headers.map(h =>
    `<option value="${escapeHtml(h)}" ${h===sel?'selected':''}>${escapeHtml(h)}</option>`
  ).join('');

  sheetBody.innerHTML = `
    <div style="margin-bottom:14px;">
      <div style="font-weight:700; font-size:15px; margin-bottom:4px;">Importar CSV</div>
      <div style="font-size:12.5px; color:var(--text-dim);">Se detectaron ${dataRows.length} filas. Elige qué columna corresponde a cada dato.</div>
    </div>
    <div class="field">
      <label>Columna de nombre / título</label>
      <select id="wNombre">${opciones(autoNombre)}</select>
    </div>
    <div class="field">
      <label>Columna de latitud</label>
      <select id="wLat">${opciones(autoLat)}</select>
    </div>
    <div class="field">
      <label>Columna de longitud</label>
      <select id="wLng">${opciones(autoLng)}</select>
    </div>
    <div class="field">
      <label>Vista previa (primera fila)</label>
      <div id="wPreview" style="font-size:12px; color:var(--text-dim); background:var(--surface-2); border-radius:8px; padding:8px;"></div>
    </div>
    <div class="save-row">
      <button class="btn" id="btnCambiarCodif" style="flex:1">¿Acentos raros? Cambiar codificación</button>
    </div>
    <div class="save-row" style="margin-top:8px;">
      <button class="btn primary" id="btnContinuarWizard" style="flex:2">Importar</button>
      <button class="btn danger" id="btnCancelarWizard">Cancelar</button>
    </div>
  `;

  const actualizarPreview = () => {
    const iN = headers.indexOf(document.getElementById('wNombre').value);
    const iLa = headers.indexOf(document.getElementById('wLat').value);
    const iLo = headers.indexOf(document.getElementById('wLng').value);
    const f = dataRows[0] || [];
    document.getElementById('wPreview').textContent =
      `${f[iN] || '—'}  ·  ${f[iLa] || '—'}, ${f[iLo] || '—'}`;
  };
  ['wNombre','wLat','wLng'].forEach(id => document.getElementById(id).addEventListener('change', actualizarPreview));
  actualizarPreview();

  document.getElementById('btnCambiarCodif').addEventListener('click', () => {
    const nuevaCodif = importCSVState.encoding === 'windows-1252' ? 'utf-8' : 'windows-1252';
    leerCSV(pendingCSVFile, nuevaCodif);
  });
  document.getElementById('btnCancelarWizard').addEventListener('click', () => {
    importCSVState = null;
    cambiarTab('lista');
  });
  document.getElementById('btnContinuarWizard').addEventListener('click', finalizarImportacionCSV);
}

function finalizarImportacionCSV(){
  const { headers, dataRows } = importCSVState;
  const colNombre = document.getElementById('wNombre').value;
  const colLat = document.getElementById('wLat').value;
  const colLng = document.getElementById('wLng').value;
  const iN = headers.indexOf(colNombre);
  const iLa = headers.indexOf(colLat);
  const iLo = headers.indexOf(colLng);

  // Columnas de contexto que se detectan solas si existen (típicas del DENUE)
  const iId = headers.findIndex(h => /^id$/i.test(h));
  const iGiro = headers.findIndex(h => /clase de.*actividad|giro/i.test(h));
  const iEstrato = headers.findIndex(h => /estrato/i.test(h));
  const iTel = headers.findIndex(h => /tel[eé]fono/i.test(h));
  const iMunicipio = headers.findIndex(h => /^municipio$/i.test(h));
  const iLocalidad = headers.findIndex(h => /^localidad$/i.test(h));
  const iEntidad = headers.findIndex(h => /entidad federativa/i.test(h));

  const datos = dataRows.map((r, idx) => {
    const lat = parseFloat(String(r[iLa]).replace(',', '.'));
    const lng = parseFloat(String(r[iLo]).replace(',', '.'));
    const nombre = (r[iN] || '').trim();
    if(!nombre || isNaN(lat) || isNaN(lng)) return null;

    const notasParts = [iGiro, iEstrato, iTel]
      .map(i => i >= 0 ? (r[i] || '').trim() : '')
      .filter(Boolean);

    const id = iId >= 0 && r[iId] ? `denue_${r[iId].trim()}` : `csv_${idx}_${lat}_${lng}`;

    return {
      id,
      nombre,
      lat: Math.round(lat * 1e6) / 1e6,
      lng: Math.round(lng * 1e6) / 1e6,
      estatus: 'Prospecto',
      frecuencia: 'Ocasional',
      notas: notasParts.join(' · '),
      origen: 'DENUE',
      estado: iEntidad >= 0 ? tituloCase((r[iEntidad] || '').trim()) : undefined,
      municipio: iMunicipio >= 0 ? (r[iMunicipio] || '').trim() : undefined,
      localidad: iLocalidad >= 0 ? (r[iLocalidad] || '').trim() : undefined,
      fechaUltimaVisita: null,
      pendienteSync: false
    };
  }).filter(Boolean);

  importCSVState = null;
  pendingCSVFile = null;
  fusionarImportados(datos);
}

function tituloCase(s){
  return s.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());
}

function abrirDetalle(id){
  editandoId = id;
  cambiarTab('alta');
}

/* ---------- Vista: Alta / edición ---------- */

  const p = editandoId ? prospectos.find(x => x.id === editandoId) : null;
  if(p){ tempCoord = { lat: p.lat, lng: p.lng }; }

  sheetBody.innerHTML = `
    <div class="loc-row">
      <button class="btn primary" id="btnGPS">${p ? 'Corregir aquí (GPS)' : 'Usar mi ubicación (GPS)'}</button>
      <button class="btn" id="btnMapPick">Marcar en el mapa</button>
    </div>
    <div class="coord-pill" id="coordPill">${tempCoord ? `Ubicación lista: ${tempCoord.lat.toFixed(5)}, ${tempCoord.lng.toFixed(5)}` : ''}</div>

    <div class="field">
      <label>Nombre del negocio</label>
      <input type="text" id="fNombre" placeholder="Ej. Refaccionaria Los 3 Hermanos" value="${p ? escapeHtml(p.nombre) : ''}">
    </div>
    <div class="field">
      <label>Estatus</label>
      <select id="fEstatus">
        ${ESTATUS.map(e => `<option ${p && p.estatus===e ? 'selected':''}>${e}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>Frecuencia de visita</label>
      <select id="fFrecuencia">
        ${FRECUENCIA.map(f => `<option ${p && p.frecuencia===f ? 'selected':''}>${f}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>Notas</label>
      <textarea id="fNotas" placeholder="Referencias, contacto, horario…">${p ? escapeHtml(p.notas||'') : ''}</textarea>
    </div>

    <div class="save-row">
      <button class="btn primary" id="btnGuardar" style="flex:2">Guardar</button>
      ${p ? '<button class="btn danger" id="btnEliminar">Eliminar</button>' : ''}
    </div>
  `;

  if(tempCoord){
    const pill = document.getElementById('coordPill');
    pill.style.display = 'block';
  }

  document.getElementById('btnGPS').addEventListener('click', usarGPSparaAlta);
  document.getElementById('btnMapPick').addEventListener('click', activarSeleccionEnMapa);
  document.getElementById('btnGuardar').addEventListener('click', guardarDesdeForm);
  const btnEliminar = document.getElementById('btnEliminar');
  if(btnEliminar) btnEliminar.addEventListener('click', eliminarActual);
}

function guardarDesdeForm(){
  const nombre = document.getElementById('fNombre').value.trim();
  const estatus = document.getElementById('fEstatus').value;
  const frecuencia = document.getElementById('fFrecuencia').value;
  const notas = document.getElementById('fNotas').value.trim();

  if(!nombre){ mostrarToast('Falta el nombre del negocio'); return; }
  if(!tempCoord){ mostrarToast('Falta la ubicación: usa GPS o marca en el mapa'); return; }

  if(editandoId){
    const p = prospectos.find(x => x.id === editandoId);
    Object.assign(p, { nombre, estatus, frecuencia, notas, lat: tempCoord.lat, lng: tempCoord.lng, pendienteSync: true });
  } else {
    prospectos.push({
      id: 'p_' + Date.now(),
      nombre, estatus, frecuencia, notas,
      lat: tempCoord.lat, lng: tempCoord.lng,
      origen: 'Manual',
      fechaUltimaVisita: null,
      pendienteSync: true
    });
  }

  guardarProspectos(prospectos);
  renderMarcadores();
  actualizarHeader();
  if(tempMarker){ map.removeLayer(tempMarker); tempMarker = null; }
  tempCoord = null;
  editandoId = null;
  mostrarToast('Guardado localmente');
  cambiarTab('lista');
}

function eliminarActual(){
  if(!confirm('¿Eliminar esta ubicación? Ya no aparecerá en el mapa ni en la lista.')) return;
  prospectos = prospectos.filter(x => x.id !== editandoId);
  guardarProspectos(prospectos);
  renderMarcadores();
  actualizarHeader();
  editandoId = null;
  mostrarToast('Prospecto eliminado');
  cambiarTab('lista');
}

/* ---------- Header / sincronización ---------- */
function actualizarHeader(){
  document.getElementById('headerSub').textContent = `${prospectos.length} registrados`;
  const pendientes = prospectos.filter(p => p.pendienteSync).length;
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  if(!navigator.onLine){
    dot.classList.remove('pend');
    dot.classList.add('offline');
    txt.textContent = 'Sin conexión';
    return;
  }
  dot.classList.remove('offline');
  if(!SHEET_ENDPOINT){
    dot.classList.toggle('pend', pendientes > 0);
    txt.textContent = pendientes > 0 ? `${pendientes} sin sincronizar` : 'Local';
  }
}
window.addEventListener('online', actualizarHeader);
window.addEventListener('offline', actualizarHeader);

/* ---------- Toast ---------- */
let toastTimer = null;
function mostrarToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- Arranque ---------- */
renderMarcadores();
actualizarHeader();
renderLista();
if(prospectos.length > 0){ ajustarVistaATodos(); }
cargarDenueCompartido();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
